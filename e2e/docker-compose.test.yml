services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_DB: v_note
      POSTGRES_USER: v_note
      POSTGRES_PASSWORD: test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v_note -d v_note"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks:
      - e2e-net

  # Mock OIDC — wired for #146 auth e2e; tests skip auth setup when OIDC_TOKEN_URL is unset.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10@sha256:65d4ed47ce094cc3849e41e03499bfb32372d69c726ec22b3d5a19eba9bc787e
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "client_id",
                  "match": "v-note-test",
                  "claims": {
                    "sub": "v-note-test-service-account",
                    "aud": ["v-note-test"],
                    "scope": "openid profile email v-note:test:access telemetry:write",
                    "preferred_username": "test-user",
                    "email": "test@example.com",
                    "name": "Test User"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-no-telemetry-test",
                  "claims": {
                    "sub": "no-telemetry-user",
                    "aud": ["v-note-test"],
                    "scope": "openid profile email v-note:test:access",
                    "preferred_username": "no-telemetry-user"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-other-app-test",
                  "claims": {
                    "sub": "other-app-user",
                    "aud": ["some-other-app"],
                    "scope": "openid profile email telemetry:write",
                    "preferred_username": "other-app-user"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-wrong-issuer-test",
                  "claims": {
                    "sub": "wrong-issuer-user",
                    "aud": ["v-note-test"],
                    "iss": "http://mock-oidc:8080/other",
                    "scope": "openid profile email v-note:test:access telemetry:write",
                    "preferred_username": "wrong-issuer-user"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-expired-test",
                  "claims": {
                    "sub": "expired-user",
                    "aud": ["v-note-test"],
                    "scope": "openid profile email v-note:test:access telemetry:write",
                    "preferred_username": "expired-user",
                    "exp": 1000000000
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-no-username-test",
                  "claims": {
                    "sub": "no-username-user",
                    "aud": ["v-note-test"],
                    "scope": "openid email v-note:test:access telemetry:write"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-other-test",
                  "claims": {
                    "sub": "v-note-other-test-user",
                    "aud": ["v-note-test"],
                    "scope": "openid profile email v-note:test:access",
                    "preferred_username": "other-test-user",
                    "email": "other@example.com"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-legacy-android-test",
                  "claims": {
                    "sub": "legacy-android-user",
                    "aud": ["v-note-android-test"],
                    "scope": "openid profile email v-note:test:access",
                    "preferred_username": "legacy-android-user",
                    "email": "legacy-android@example.com"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-test-wrong",
                  "claims": {
                    "sub": "wrong-scope-user",
                    "aud": ["v-note-test"],
                    "scope": "openid profile email v-note:wrong:access",
                    "preferred_username": "wrong-scope-user",
                    "email": "wrong@example.com"
                  }
                }
              ]
            }
          ]
        }
    networks:
      - e2e-net

  app:
    image: ${TEST_IMAGE:?TEST_IMAGE must be set}
    environment:
      # No sovereign-config server in e2e: the access URL is left unset so that
      # layer is skipped and every group is supplied from the VNOTE__* env layer.
      # Multi-word leaf segments are kebab-case to match sovereign-config paths.
      # (server group — tls/static/port — comes from the image's own ENV defaults.)
      VNOTE__OBSERVABILITY__ENVIRONMENT: test
      VNOTE__OIDC__ISSUER-URL: http://mock-oidc:8080/default
      VNOTE__OIDC__CLIENT-ID: v-note-test
      VNOTE__OIDC__REDIRECT-URI: https://app:443/auth/callback
      VNOTE__OIDC__REQUIRED-SCOPE: v-note:test:access
      VNOTE__DATABASE__HOST: postgres
      VNOTE__DATABASE__PORT: "5432"
      VNOTE__DATABASE__USER: v_note
      VNOTE__DATABASE__PASSWORD: test-password
      VNOTE__DATABASE__NAME: v_note
      # #342: the whole realtime suite runs with `permessage-deflate` offered,
      # so every WebSocket test below exercises the compressed path through a
      # real browser rather than only the dedicated negotiation test. The leaf
      # ships **off** (see `RealtimeConfig::compression`) — e2e deliberately
      # runs the target state, not the shipping default, because the acceptance
      # for #342 is that a real browser negotiates and then works. The off path
      # is the pre-#342 wire and is covered by the config unit tests.
      VNOTE__REALTIME__COMPRESSION: "true"
      # #439: clients are told to send to the otlp-collector-oidc service
      # below. Unset ships "off" (the config route answers 204); e2e runs it on
      # because the acceptance is that the real path works. The off path is
      # `crates/server/tests/telemetry_config.rs`, and the SPA's handling of it
      # is in client-telemetry.spec.ts.
      #
      # A second origin, not the app's: this stack has no Traefik to route
      # `/v1/` on the app's host to the ingest, as the deployed stack does. So
      # the SPA's export is cross-origin here (the ingest's CORS_ALLOWED_ORIGINS
      # admits it) where it is same-origin in dev. The client code is the same
      # either way; the routing is checked on dev.
      VNOTE__CLIENT-TELEMETRY__ENDPOINT: https://otlp-collector-oidc:4318
      # The server's OWN spans and, from #417, its logs — exported to the
      # shared-Alloy stand-in below, as a deployed server exports to
      # monitor-alloy. Without spans the browser's trace would arrive with
      # nothing beneath it; without the stand-in's logs pipeline Tempo would be
      # the only receiver, and it does not take logs.
      VNOTE__OBSERVABILITY__OTLP-ENDPOINT: http://monitor-alloy:4317
    # What the deployed stack sets (deploy/docker-compose.yml), and what the
    # stand-in's Docker scrape reads, as the shared Alloy does: `service_name`
    # and `deployment_environment` on the stdout copy of every line.
    labels:
      observability.service.name: v-note
      observability.deployment.environment: test
    # `test` is deliberately absent: the probe command is inherited from the
    # image (Dockerfile.web), so there is still exactly one definition of what
    # "healthy" means. Only the timings are overridden, because the image is
    # tuned for a long-lived production container and a test run should not wait
    # up to 30s for the first probe.
    healthcheck:
      interval: 1s
      start_period: 2s
      retries: 60
    depends_on:
      mock-oidc:
        condition: service_started
      postgres:
        condition: service_healthy
      # Up before the server so its startup lines — the resolved observability
      # config among them — are exported rather than retried into the void.
      monitor-alloy:
        condition: service_healthy
    networks:
      - e2e-net

  legacy-migration-fixture:
    image: v-note-e2e-legacy-migration-fixture:${OCI_IMAGE_VERSION:-local}
    build:
      context: .
      additional_contexts:
        server-migrations: ../crates/server/migrations
      dockerfile_inline: |
        FROM postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        COPY fixtures/legacy-stroke.sql /fixtures/legacy-stroke.sql
        COPY --from=server-migrations 20260716003000_backfill_legacy_strokes.sql /migrations/20260716003000_backfill_legacy_strokes.sql
        COPY --from=server-migrations 20260718011500_add_stroke_batch_revisions.sql /migrations/20260718011500_add_stroke_batch_revisions.sql
        COPY --from=server-migrations 20260920120000_retire_v1_stroke_style.sql /migrations/20260920120000_retire_v1_stroke_style.sql
    environment:
      PGPASSWORD: test-password
    command:
      - sh
      - -ec
      - |
        until psql -h postgres -U v_note -d v_note -tAc "SELECT COALESCE((SELECT success FROM _sqlx_migrations WHERE version = 20260718011500), false)" | grep -q t; do sleep 1; done
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note -c "ALTER TABLE stroke_batches ALTER COLUMN revision DROP NOT NULL"
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note -f /fixtures/legacy-stroke.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note -f /migrations/20260716003000_backfill_legacy_strokes.sql
        first_id="$$(psql -h postgres -U v_note -d v_note -tAc "SELECT strokes->0->>'id' FROM stroke_batches WHERE page_id = 'page_legacy_v2'")"
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note -f /migrations/20260716003000_backfill_legacy_strokes.sql
        second_id="$$(psql -h postgres -U v_note -d v_note -tAc "SELECT strokes->0->>'id' FROM stroke_batches WHERE page_id = 'page_legacy_v2'")"
        test -n "$$first_id" && test "$$first_id" = "$$second_id"
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note -f /migrations/20260718011500_add_stroke_batch_revisions.sql
        first_revision="$$(psql -h postgres -U v_note -d v_note -tAc "SELECT revision FROM stroke_batches WHERE page_id = 'page_legacy_v2'")"
        history_revisions="$$(psql -h postgres -U v_note -d v_note -tAc "SELECT string_agg(revision::text, ',' ORDER BY seq) FROM stroke_batches WHERE page_id = 'page_revision_history'")"
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note -f /migrations/20260718011500_add_stroke_batch_revisions.sql
        second_revision="$$(psql -h postgres -U v_note -d v_note -tAc "SELECT revision FROM stroke_batches WHERE page_id = 'page_legacy_v2'")"
        test "$$first_revision" = "1" && test "$$first_revision" = "$$second_revision"
        test "$$history_revisions" = "1,3"
        legacy_versions="$$(psql -h postgres -U v_note -d v_note -tAc "SELECT string_agg(DISTINCT stroke #>> '{style,style_version}', ',') FROM stroke_batches, jsonb_array_elements(strokes) AS s(stroke) WHERE page_id = 'page_legacy_v2'")"
        test "$$legacy_versions" = "1"
        # Pre-state is asserted only on page_legacy_v2: it is seeded `DO UPDATE
        # SET strokes`, so it genuinely resets to the pre-style shape on every
        # run. page_revision_history is `DO NOTHING` and would still be v2 from a
        # previous run against a reused postgres volume — it stays in the
        # post-migration checks below, which are before-vs-after and re-run safe.
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note -f /migrations/20260920120000_retire_v1_stroke_style.sql
        first_styles="$$(psql -h postgres -U v_note -d v_note -tAc "SELECT string_agg(stroke #>> '{style,style_version}', ',' ORDER BY page_id, seq) FROM stroke_batches, jsonb_array_elements(strokes) AS s(stroke) WHERE page_id IN ('page_legacy_v2', 'page_revision_history')")"
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note -f /migrations/20260920120000_retire_v1_stroke_style.sql
        second_styles="$$(psql -h postgres -U v_note -d v_note -tAc "SELECT string_agg(stroke #>> '{style,style_version}', ',' ORDER BY page_id, seq) FROM stroke_batches, jsonb_array_elements(strokes) AS s(stroke) WHERE page_id IN ('page_legacy_v2', 'page_revision_history')")"
        test "$$first_styles" = "2,2,2" && test "$$first_styles" = "$$second_styles"
        pressure_points="$$(psql -h postgres -U v_note -d v_note -tAc "SELECT count(*) FROM stroke_batches, jsonb_array_elements(strokes) AS s(stroke), jsonb_array_elements(s.stroke -> 'points') AS p(point) WHERE page_id IN ('page_legacy_v2', 'page_revision_history') AND point ? 'pressure'")"
        test "$$pressure_points" = "0"
        touch /tmp/fixture-ready
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/fixture-ready"]
      interval: 1s
      timeout: 2s
      retries: 20
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - e2e-net

  # SQL console (#299). Deliberately NOT behind a compose profile here, unlike
  # deploy/docker-compose.yml: there the profile is the deploy-time toggle, and
  # here there is nothing to toggle — the console is part of what this stack
  # exists to test, and profiling it would mean threading COMPOSE_PROFILES
  # through every documented e2e invocation to no benefit. The toggle itself is
  # covered by scripts/test-deploy-v-note.sh.
  #
  # This stack has no Traefik and no Authentik, so it cannot test the network
  # boundary (that is scripts/smoke-sql-console.sh, post-deploy). What it tests
  # is the boundary that lives in the database, which is the one the #299 spike
  # found was load-bearing: pgweb's "read-only" mode against a superuser is
  # arbitrary host-file read, so the privilege separation has to be real.
  sqltool-provision:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      PGPASSWORD: test-password
      # Matches the value in sqltool's connection string below. A test-only
      # credential on a throwaway database, so it is literal here — the deployed
      # stack takes it from sovereign-config.
      PGWEB_NEW_PASSWORD: pgweb-test-password
    # The role is created by the migration, which the *app* runs at startup, so
    # this waits for that specific migration rather than for the app's health —
    # same pattern as legacy-migration-fixture above. Only the password is set
    # here, exactly as deploy-v-note.sh does it in a real environment.
    command:
      - sh
      - -ec
      - |
        until psql -h postgres -U v_note -d v_note -tAc "SELECT COALESCE((SELECT success FROM _sqlx_migrations WHERE version = 20260920140000), false)" | grep -q t; do sleep 1; done
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note <<'SQL'
        \getenv pgweb_pw PGWEB_NEW_PASSWORD
        ALTER ROLE v_note_pgweb WITH LOGIN PASSWORD :'pgweb_pw';
        SQL
        # Created as v_note *after* the migration ran its GRANTs, so the console
        # can only read it if ALTER DEFAULT PRIVILEGES took. That is the
        # difference between "this role was granted the tables that existed in
        # September" and "this role can read what later migrations add" — and
        # the second one is the claim the card makes. Asserting it against an
        # existing table would prove nothing, since the blanket
        # GRANT ... ON ALL TABLES already covers those.
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note \
          -c "CREATE TABLE IF NOT EXISTS e2e_default_privileges_probe (i int)"
        touch /tmp/provisioned
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/provisioned"]
      interval: 1s
      timeout: 2s
      retries: 30
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - e2e-net

  sqltool:
    image: sosedoff/pgweb@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    environment:
      # Same shape as the deployed service: the read-only role, never v_note.
      PGWEB_DATABASE_URL: postgres://v_note_pgweb:pgweb-test-password@postgres:5432/v_note?sslmode=disable
      PGWEB_URL_PREFIX: dbconsole
      PGWEB_LOCK_SESSION: "1"
      # Basic auth stays ON here too, so the spec exercises the same service
      # configuration that ships. In the deployment Traefik injects this header
      # after Authentik approves; here the spec sends it itself.
      PGWEB_AUTH_USER: console
      PGWEB_AUTH_PASS: console-test-password
    command:
      - --bind=0.0.0.0
      - --listen=8081
      - --readonly
      - --skip-open
      - --log-format=json
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/dbconsole/api/info | grep -q 401"]
      interval: 1s
      timeout: 5s
      retries: 60
    depends_on:
      sqltool-provision:
        condition: service_healthy
    networks:
      - e2e-net

  # Client telemetry (#439). The ingest is the published image, pinned — the
  # thing that ships, not a stand-in — and the backends behind it are real:
  #
  #   otlp-collector-oidc  the estate's reference ingest, as deploy/ runs it
  #   monitor-alloy        a stand-in for the SHARED Alloy the ingest forwards
  #                        every signal to (e2e/alloy/monitor-alloy.alloy;
  #                        #417's, mirroring mini-config #47)
  #   tempo, loki          real stores, at the digests mini-config runs
  #
  # so client-telemetry.spec.ts asserts on what the backends actually stored.
  # A mock collector would happily "receive" a span carrying the forged
  # identity the ingest was supposed to have overwritten.
  otlp-collector-oidc:
    # Pinned by tag and digest: the image is unproven, and every behaviour the
    # spec asserts is a fact about exactly this build (#439). Same pin as
    # deploy/docker-compose.yml; bump them together.
    image: ghcr.io/vcheesbrough/otlp-collector-oidc:0.13.0@sha256:2db8a527da487c9091b74ee3a537785153b26f914e9e6f3ca2f1684793f02666
    environment:
      OIDC_ISSUER_URL: http://mock-oidc:8080/default
      OIDC_AUDIENCE: v-note-test
      # The mock IdP starts alongside; do not wait the default 30s to retry.
      OIDC_DISCOVERY_RETRY: 1s
      ALLOWED_SERVICE_NAMES: ^v-note-(spa|android)$
      # Distinctive on purpose: `dev` would also be what an ingest that ignored
      # its config produced.
      CLIENT_RESOURCE_ATTRIBUTES: deployment.environment.name=e2e-ingest,telemetry_source=client
      # Every signal through the shared-Alloy stand-in, as deployed.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://monitor-alloy:4317
      OTEL_SERVICE_NAME: v-note-otlp-collector-oidc
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=e2e-ingest,telemetry_source=otlp
      # stdout too: this stack has no Docker log scrape for it, and a failing CI
      # run wants the ingest's refusals in the compose output.
      LOG_OUTPUT: both
      # The SPA's origin here. Not set in deploy/, where the export is
      # same-origin behind Traefik.
      # An Origin header omits the scheme's default port, so this is
      # `https://app`, not the `https://app:443` BASE_URL spells.
      CORS_ALLOWED_ORIGINS: https://app
    healthcheck:
      interval: 1s
      start_period: 2s
      retries: 60
    depends_on:
      mock-oidc:
        condition: service_started
      monitor-alloy:
        condition: service_healthy
    networks:
      - e2e-net

  # Stand-in for the SHARED monitoring Alloy (#417): the collector a deployed
  # server exports its own telemetry to, and the Docker scrape that ships its
  # stdout. A fixture mirroring mini-config's config.alloy, not a deployed
  # artifact — see the header of e2e/alloy/monitor-alloy.alloy for what it
  # mirrors (as of mini-config #47), what it leaves out, and the drift risk.
  # Named for the real service so a config that names `monitor-alloy` reads the
  # same here and on dev.
  monitor-alloy:
    image: v-note-e2e-monitor-alloy:${OCI_IMAGE_VERSION:-local}
    build:
      context: .
      dockerfile_inline: |
        FROM grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
        COPY alloy/monitor-alloy.alloy /etc/alloy/monitor-alloy.alloy
    command:
      - run
      - /etc/alloy/monitor-alloy.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/tmp/alloy
    environment:
      # Narrows the Docker scrape to this stack's `app`. A CI host's socket sees
      # every container on the machine; compose's own default project name is
      # the directory, `e2e`.
      E2E_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-e2e}
    volumes:
      # The Docker scrape, exactly as the shared Alloy is given it. The one bind
      # mount in this file that works when compose runs inside a CI container:
      # the source is the daemon's own socket, which exists on the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4317 && exec 4<>/dev/tcp/127.0.0.1/4318"]
      interval: 1s
      timeout: 5s
      retries: 60
    networks:
      - e2e-net

  tempo:
    image: v-note-e2e-tempo:${OCI_IMAGE_VERSION:-local}
    build:
      context: .
      dockerfile_inline: |
        FROM grafana/tempo:2.10.7@sha256:032b3acb51ed02c4b801473d54bb63e9e9f13738d215126d9843c30283794f4b
        COPY fixtures/tempo.yaml /etc/tempo.yaml
    command: ["-config.file=/etc/tempo.yaml"]
    # No healthcheck: the image has no shell to run one with. The spec waits on
    # /ready itself, which it has to do anyway — Tempo's ring takes ~15s to
    # settle after the process is up, and a started container is not a ready one.
    networks:
      - e2e-net

  loki:
    # Single binary, filesystem storage, structured metadata on (which OTLP
    # ingest requires) — and, from #418, `log_source` indexed as a stream label
    # the way mini-config's Loki indexes it, so the spec's selectors on the
    # marker mean what they say. No healthcheck for the same reason as tempo —
    # distroless, no shell — so the spec waits on /ready.
    image: v-note-e2e-loki:${OCI_IMAGE_VERSION:-local}
    build:
      context: .
      dockerfile_inline: |
        FROM grafana/loki:3.7.3@sha256:70b9f699fc9bb868b62f1cfd4f787dfa50242f1fd92e6089787d5d7daea75fe8
        COPY fixtures/loki.yaml /etc/loki/local-config.yaml
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks:
      - e2e-net

  playwright:
    image: v-note-e2e-playwright:${OCI_IMAGE_VERSION:-local}
    build:
      context: .
      # #439: the ingest metric names the dashboard charts, so the spec can
      # prove the pinned image exports every one of them.
      additional_contexts:
        grafana: ../deploy/grafana
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.54.2-jammy@sha256:948dc1e8601eeb152b31ef57959a74c2170be6fe875c33518bf33aea424d8940
        WORKDIR /e2e
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        COPY --from=grafana otlp-collector-oidc-metrics.txt /e2e/fixtures/otlp-collector-oidc-metrics.txt
        CMD ["npx", "playwright", "test"]
      labels:
        org.opencontainers.image.title: v-note-e2e-playwright
        org.opencontainers.image.description: v-note Playwright e2e test runner image
        org.opencontainers.image.licenses: PolyForm-Noncommercial-1.0.0
        org.opencontainers.image.url: https://github.com/vcheesbrough/v-note
        org.opencontainers.image.authors: Vincent Cheesbrough
        org.opencontainers.image.vendor: Vincent Cheesbrough
        org.opencontainers.image.documentation: https://github.com/vcheesbrough/v-note/blob/master/docs/DEPLOY.md
        org.opencontainers.image.base.name: mcr.microsoft.com/playwright:v1.54.2-jammy
        org.opencontainers.image.base.digest: sha256:948dc1e8601eeb152b31ef57959a74c2170be6fe875c33518bf33aea424d8940
        org.opencontainers.image.version: ${OCI_IMAGE_VERSION:-local}
        org.opencontainers.image.revision: ${OCI_IMAGE_REVISION:-dev}
        org.opencontainers.image.source: https://github.com/vcheesbrough/v-note
        org.opencontainers.image.created: ${OCI_IMAGE_CREATED:-unknown}
    environment:
      BASE_URL: https://app:443
      OIDC_TOKEN_URL: http://mock-oidc:8080/default/token
      OIDC_CLIENT_ID: v-note-test
      # Mock-IdP-only: mints test tokens via client_credentials. The app is public (#274).
      MOCK_OIDC_CLIENT_SECRET: test-secret
      REQUIRED_SCOPE: v-note:test:access
      # #299 — the console's API, and the credential Traefik would inject in a
      # real deployment. Absent means the sql-console spec skips, so the suite
      # still runs against a stack without the console.
      SQL_CONSOLE_URL: http://sqltool:8081/dbconsole
      SQL_CONSOLE_AUTH_USER: console
      SQL_CONSOLE_AUTH_PASS: console-test-password
      # #439 — the ingest the spec drives directly (as a simulated Android
      # client, and to prove each refusal), its own metrics, and where it reads
      # back what was stored. The expected environment is the ingest's
      # CLIENT_RESOURCE_ATTRIBUTES value, passed here so the spec asserts
      # against the stack's config, not a copy of it.
      INGEST_URL: https://otlp-collector-oidc:4318
      INGEST_METRICS_URL: http://otlp-collector-oidc:8888/metrics
      TEMPO_URL: http://tempo:3200
      LOKI_URL: http://loki:3100
      CLIENT_TELEMETRY_EXPECTED_ENV: e2e-ingest
    volumes:
      - ${REPORT_DIR:-./playwright-report}:/e2e/playwright-report
    depends_on:
      app:
        condition: service_healthy
      mock-oidc:
        condition: service_started
      legacy-migration-fixture:
        condition: service_healthy
      sqltool:
        condition: service_healthy
      otlp-collector-oidc:
        condition: service_healthy
      monitor-alloy:
        condition: service_healthy
      # `service_started`, not healthy: neither image can run a healthcheck.
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - e2e-net

networks:
  e2e-net:
