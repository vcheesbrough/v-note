# Step DAG: set depends_on on any step to enable parallel execution (Woodpecker stages).
# Push: compute-version ∥ lint ∥ contract-validation ∥ deploy-script-validation ∥ build-android ∥ Android API 29/36 instrumented → build-web → e2e-web; all push gates → apply-authentik-blueprint-auto-dev → auto-deploy-dev → tag-release-auto-dev
# Deploy: validate-deployment ∥ compute-version ∥ apply-authentik-blueprint → deploy-* → tag-release

when:
  - event: [push, deployment, manual]

steps:
  compute-version:
    when:
      - event: [push, deployment, manual]
    depends_on: []
    pull: true
    image: &version-plugin ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.1.0@sha256:81a29c3a5785c146b5b3dfd7e0d8e7edb353b72e4e53bdbef4f7e13a88488c59
    settings:
      mode: compute
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  # Both gates the plan always claimed CI enforced, and until now did not: 17
  # clippy errors accumulated unnoticed across the 1.98.1 bump because nothing
  # here ran clippy. Separate from contract-validation so a lint failure reads as
  # a lint failure, and so it can fail fast in the first parallel stage.
  lint:
    when:
      - event: [push, manual]
    depends_on: []
    image: &rust-image rust:1.98.1@sha256:462a9af3c54fb4718850d3c602fc0e54452c20b1c12a4e4080fdb001d4b9acbf
    environment:
      # As in contract-validation: the image already *is* the pinned toolchain,
      # so pin rustup to it rather than let rust-toolchain.toml re-resolve the
      # same version. The `rust:` images ship a minimal profile, so clippy and
      # rustfmt genuinely are absent and must be added — that is the one thing
      # this step needs that contract-validation deliberately avoids.
      RUSTUP_TOOLCHAIN: "1.98.1"
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - rustup component add clippy rustfmt
      # sovereign-config-provider is a git+tag dep on a private repo — see
      # contract-validation for why every workspace member needs this.
      - export CARGO_NET_GIT_FETCH_WITH_CLI=true
      - export GIT_CONFIG_COUNT=1
      - export GIT_CONFIG_KEY_0="url.https://x-access-token:$${GITHUB_TOKEN}@github.com/.insteadOf"
      - export GIT_CONFIG_VALUE_0="https://github.com/"
      # Clippy first, deliberately. Both gates are hard failures and the step
      # stops at the first, so whichever runs second is the one a contributor
      # only learns about on the next push. Clippy is the gate that catches
      # bugs; rustfmt is the one a keystroke fixes — better to mask the cheap
      # signal than the expensive one.
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo fmt --all --check

  contract-validation:
    when:
      - event: [push, manual]
    depends_on: []
    # Rust toolchain pin — keep byte-identical with the builder `FROM` in
    # `Dockerfile.web` and the channel in `rust-toolchain.toml` (host dev).
    image: *rust-image
    environment:
      # The image already *is* the pinned toolchain. Without this, rust-toolchain.toml
      # — present in the clone, since .dockerignore only applies to `docker build` —
      # makes rustup pull rustfmt/clippy/wasm-std, which this step never uses.
      RUSTUP_TOOLCHAIN: "1.98.1"
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      # sovereign-config-provider is a git+tag dep on a private repo; cargo must be
      # able to resolve it even for workspace members that don't depend on it.
      - export CARGO_NET_GIT_FETCH_WITH_CLI=true
      - export GIT_CONFIG_COUNT=1
      - export GIT_CONFIG_KEY_0="url.https://x-access-token:$${GITHUB_TOKEN}@github.com/.insteadOf"
      - export GIT_CONFIG_VALUE_0="https://github.com/"
      - cargo test -p protocol
      - cargo test -p frontend
      - cargo test -p server
      - ./scripts/check-android-build-box-image.sh

  build-android:
    when:
      - event: [push, manual]
    depends_on:
      - compute-version
    # mingc/android-build-box as a Woodpecker step image does not attach stdout to logs.
    # docker run -v $CI_WORKSPACE fails when the agent workspace is a named volume, not a
    # host path — use docker build (context over API) like build-web.
    image: &docker-image docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes: &docker-socket
      - /var/run/docker.sock:/var/run/docker.sock
    environment: &registry-creds
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/v-note-android:$$RELEASE_TAG
        START=$$(date +%s)
        docker build -f Dockerfile.android \
          --build-arg ANDROID_BUILD_BOX_IMAGE=$$(cat scripts/android-build-box-image.ref) \
          --build-arg V_NOTE_RELEASE="$$RELEASE_TAG" \
          --build-arg OCI_IMAGE_VERSION="$$RELEASE_TAG" \
          --build-arg OCI_IMAGE_REVISION="$$CI_COMMIT_SHA" \
          --build-arg OCI_IMAGE_CREATED="$$(git -c safe.directory='*' log -1 --format=%cI)" \
          -t "$$IMAGE" .
        echo "timing: docker build Dockerfile.android took $$(( $$(date +%s) - $$START ))s"
        ./scripts/check-image-metadata.sh "$$IMAGE" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
        START=$$(date +%s)
        docker push "$$IMAGE"
        echo "timing: docker push $$IMAGE took $$(( $$(date +%s) - $$START ))s"

  # deploy-v-note.sh takes no arguments: every environment-specific value is a
  # parameter set by the deploy steps below, so a missing one is not a crash but a
  # silently wrong deploy (prod labelled env=dev, a parallel compose project, an
  # app with no runtime config). The deploy steps only ever exercise the happy
  # path, so the guards get their own test. Runs on the docker CLI image for the
  # compose plugin — `compose config` resolves the model client-side, so this
  # needs no docker socket. Placed here only because it uses the *docker-image
  # anchor defined above; `depends_on: []` keeps it in the first parallel stage.
  deploy-script-validation:
    when:
      - event: [push, manual]
    depends_on: []
    image: *docker-image
    commands:
      - ./scripts/test-deploy-v-note.sh

  android-instrumented-api-29:
    when:
      - event: [push, manual]
    depends_on:
      - compute-version
    image: *docker-image
    volumes: *docker-socket
    environment:
      ANDROID_API_LEVEL: "29"
    commands: &android-instrumented-commands
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=v-note-android-instrumented:$$CI_COMMIT_SHA-api$$ANDROID_API_LEVEL
        # The pin lives in scripts/android-build-box-image.ref; split it on `@` so
        # the FROM and the OCI base.* labels are fed from that one value.
        BUILD_BOX_REF=$$(cat scripts/android-build-box-image.ref)
        START=$$(date +%s)
        docker build -f Dockerfile.android-instrumented \
          --build-arg BASE_IMAGE_NAME="$${BUILD_BOX_REF%@*}" \
          --build-arg BASE_IMAGE_DIGEST="$${BUILD_BOX_REF#*@}" \
          --build-arg ANDROID_API_LEVEL="$$ANDROID_API_LEVEL" \
          --build-arg V_NOTE_RELEASE="$$RELEASE_TAG" \
          --build-arg OCI_IMAGE_VERSION="$$RELEASE_TAG" \
          --build-arg OCI_IMAGE_REVISION="$$CI_COMMIT_SHA" \
          --build-arg OCI_IMAGE_CREATED="$$(git -c safe.directory='*' log -1 --format=%cI)" \
          -t "$$IMAGE" .
        echo "timing: docker build Dockerfile.android-instrumented took $$(( $$(date +%s) - $$START ))s"
        ./scripts/check-image-metadata.sh "$$IMAGE" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
      - |
        START=$$(date +%s)
        if [ -c /dev/kvm ]; then
          docker run --rm --privileged --device=/dev/kvm v-note-android-instrumented:$$CI_COMMIT_SHA-api$$ANDROID_API_LEVEL
        else
          docker run --rm --privileged v-note-android-instrumented:$$CI_COMMIT_SHA-api$$ANDROID_API_LEVEL
        fi
        echo "timing: Android API $$ANDROID_API_LEVEL instrumented docker run took $$(( $$(date +%s) - $$START ))s"

  android-instrumented-api-36:
    when:
      - event: [push, manual]
    depends_on:
      - compute-version
    image: *docker-image
    volumes: *docker-socket
    environment:
      ANDROID_API_LEVEL: "36"
    commands: *android-instrumented-commands

  build-web:
    when:
      - event: [push, manual]
    depends_on:
      - compute-version
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      # Needed by the cargo layers to fetch the private sovereign-config git dep.
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/v-note:$$RELEASE_TAG
        START=$$(date +%s)
        docker build -f Dockerfile.web \
          --secret id=github_token,env=GITHUB_TOKEN \
          --build-arg V_NOTE_RELEASE="$$RELEASE_TAG" \
          --build-arg OCI_IMAGE_VERSION="$$RELEASE_TAG" \
          --build-arg OCI_IMAGE_REVISION="$$CI_COMMIT_SHA" \
          --build-arg OCI_IMAGE_CREATED="$$(git -c safe.directory='*' log -1 --format=%cI)" \
          -t "$$IMAGE" .
        echo "timing: docker build Dockerfile.web took $$(( $$(date +%s) - $$START ))s"
        # The image that actually ships, gated on the same label contract the e2e
        # support image is held to — this is the check that caught the missing
        # authors/vendor labels the old --label flags never set.
        ./scripts/check-image-metadata.sh "$$IMAGE" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
        # Both gated before the push: the deploy step and the e2e stack below now
        # wait on this image's own healthcheck, so an image whose probe is broken
        # would not fail loudly — it would hang until a timeout.
        ./scripts/test-container-health.sh "$$IMAGE"
        START=$$(date +%s)
        docker push "$$IMAGE"
        echo "timing: docker push $$IMAGE took $$(( $$(date +%s) - $$START ))s"

  e2e-web:
    when:
      - event: [push, manual]
    depends_on:
      - build-web
    image: *docker-image
    volumes: *docker-socket
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        export OCI_IMAGE_VERSION="$$RELEASE_TAG"
        export OCI_IMAGE_REVISION="$$CI_COMMIT_SHA"
        export OCI_IMAGE_CREATED="$$(git -c safe.directory='*' log -1 --format=%cI)"
        REPORT=/srv/dev/playwright-reports/v-note-$$CI_PIPELINE_NUMBER--$(echo $$CI_COMMIT_BRANCH | tr '/' '-')--$(echo $$CI_COMMIT_SHA | cut -c1-7)
        START=$$(date +%s)
        TEST_IMAGE="registry.desync.link/v-note:$$RELEASE_TAG" docker compose -f e2e/docker-compose.test.yml -f e2e/docker-compose.android-apk.test.yml build playwright v-note-android-apk legacy-migration-fixture
        echo "timing: e2e support image build took $$(( $$(date +%s) - $$START ))s"
        ./scripts/check-image-metadata.sh "v-note-e2e-playwright:$$RELEASE_TAG" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
        START=$$(date +%s)
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/v-note:$$RELEASE_TAG docker compose -f e2e/docker-compose.test.yml -f e2e/docker-compose.android-apk.test.yml up --force-recreate --abort-on-container-exit --exit-code-from playwright && RC=0 || RC=$$?
        echo "timing: e2e compose up took $$(( $$(date +%s) - $$START ))s"
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/v-note:$$RELEASE_TAG docker compose -f e2e/docker-compose.test.yml -f e2e/docker-compose.android-apk.test.yml down --volumes
        echo "Test report: $$REPORT/index.html"
        exit $$RC

  validate-deployment:
    when:
      - event: deployment
    depends_on: []
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    commands:
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" != "dev" ] && [ "$$CI_PIPELINE_DEPLOY_TARGET" != "prod" ]; then
          echo "ERROR: deploy target must be 'dev' or 'prod' (got: '$$CI_PIPELINE_DEPLOY_TARGET')"
          exit 1
        fi
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" = "prod" ] && [ "$$CI_COMMIT_BRANCH" != "master" ]; then
          echo "ERROR: prod can only be deployed from master (current branch: '$$CI_COMMIT_BRANCH')"
          exit 1
        fi

  apply-authentik-blueprint:
    when:
      - event: deployment
    depends_on: 
      - validate-deployment
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0@sha256:9f262c4390205b5629e9af7560f4e492f0155395a429153703ba351206d9d975
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint.yaml
      instance_name: v-note
      timeout_seconds: 900
      vars:
        AUTHENTIK_V_NOTE_DEV_CLIENT_SECRET:
          from_secret: v_note_dev_oidc_client_secret
        AUTHENTIK_V_NOTE_PROD_CLIENT_SECRET:
          from_secret: v_note_prod_oidc_client_secret

  apply-authentik-blueprint-auto-dev:
    when:
      - event: push
    depends_on:
      - lint
      - contract-validation
      - build-android
      - android-instrumented-api-29
      - android-instrumented-api-36
      - e2e-web
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0@sha256:9f262c4390205b5629e9af7560f4e492f0155395a429153703ba351206d9d975
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint.yaml
      instance_name: v-note
      timeout_seconds: 900
      vars:
        AUTHENTIK_V_NOTE_DEV_CLIENT_SECRET:
          from_secret: v_note_dev_oidc_client_secret
        AUTHENTIK_V_NOTE_PROD_CLIENT_SECRET:
          from_secret: v_note_prod_oidc_client_secret

  deploy-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - validate-deployment
      - compute-version
      - apply-authentik-blueprint
    image: *docker-image
    volumes: *docker-socket
    # The whole dev environment, defined once and reused by auto-deploy-dev.
    # deploy-v-note.sh takes no arguments and knows nothing about dev vs prod —
    # every environment-specific value is right here.
    environment: &deploy-dev-environment
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      POSTGRES_PASSWORD:
        from_secret: v_note_dev_postgres_password
      # Unlocks the /v-note/dev/server sovereign-config subtree; the URL
      # itself selects the environment.
      SOVEREIGN_CONFIG_ACCESS_URL_FILE:
        from_secret: v_note_dev_sovereign_access_url
      # Alias of /v-note/dev/server/observability/metrics-addr — the same stored
      # value the app reads, exposed to the broker so the deploy can derive the
      # Alloy scrape labels docker writes at container-create time. A plain
      # value, not a secret; `from_secret` is Woodpecker's only broker channel.
      V_NOTE_METRICS_ADDR:
        from_secret: v_note_dev_metrics_addr
      # Read by `docker compose` itself, so the script needs no -p/-f flags.
      COMPOSE_PROJECT_NAME: v-note-dev
      COMPOSE_FILE: deploy/docker-compose.yml:deploy/docker-compose.android-apk.yml
      V_NOTE_IMAGE_REPOS: registry.desync.link/v-note registry.desync.link/v-note-android
      V_NOTE_HOST: v-notes-dev.desync.link
      V_NOTE_CONTAINER_NAME: v-note-dev
      DB_VOLUME: v-note-dev-db
      # Canonical environment name, matching the sovereign-config
      # `observability/environment` leaf the server uses for the OTEL
      # `deployment.environment` trace attribute. Deliberately not the branch
      # name: that split one deployment across two values, so traces said `dev`
      # while the metrics/log discovery labels said e.g. `feat/foo` and no single
      # environment filter matched all three signals. The build is already
      # identified by `observability.release` and the image's
      # `org.opencontainers.image.revision`.
      APP_ENV: dev
    commands: &deploy-commands
      - ./scripts/deploy-v-note.sh

  auto-deploy-dev:
    when:
      - event: push
    depends_on:
      - compute-version
      - apply-authentik-blueprint-auto-dev
    image: *docker-image
    volumes: *docker-socket
    environment: *deploy-dev-environment
    commands: *deploy-commands

  tag-release-auto-dev:
    when:
      - event: push
    depends_on:
      - auto-deploy-dev
    pull: true
    image: *version-plugin
    settings:
      mode: push-tag
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  deploy-prod:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    depends_on:
      - validate-deployment
      - compute-version
      - apply-authentik-blueprint
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      POSTGRES_PASSWORD:
        from_secret: v_note_prod_postgres_password
      # Unlocks the /v-note/prod/server sovereign-config subtree.
      SOVEREIGN_CONFIG_ACCESS_URL_FILE:
        from_secret: v_note_prod_sovereign_access_url
      # Alias of /v-note/prod/server/observability/metrics-addr — see deploy-dev.
      V_NOTE_METRICS_ADDR:
        from_secret: v_note_prod_metrics_addr
      # No android-apk overlay on prod: the APK delivery image is dev-only.
      COMPOSE_PROJECT_NAME: v-note
      COMPOSE_FILE: deploy/docker-compose.yml
      V_NOTE_IMAGE_REPOS: registry.desync.link/v-note
      V_NOTE_HOST: v-notes.desync.link
      V_NOTE_CONTAINER_NAME: v-note
      DB_VOLUME: v-note-prod-db
      APP_ENV: production
    commands: *deploy-commands

  tag-release-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - deploy-dev
    pull: true
    image: *version-plugin
    settings: &push-tag-settings
      mode: push-tag
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  tag-release-prod:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    depends_on:
      - deploy-prod
    pull: true
    image: *version-plugin
    settings: *push-tag-settings
