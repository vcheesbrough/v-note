# APK download route test overlay — adds a minimal nginx fixture for android-apk.spec.ts.
# Usage: docker compose -f e2e/docker-compose.test.yml -f e2e/docker-compose.android-apk.test.yml up

services:
  v-note-android-apk:
    build:
      context: .
      dockerfile_inline: |
        FROM nginx:alpine@sha256:8b1e78743a03dbb2c95171cc58639fef29abc8816598e27fb910ed2e621e589a
        RUN mkdir -p /usr/share/nginx/html/downloads/android \
            && echo 'fake-apk-fixture' > /usr/share/nginx/html/downloads/android/v-note.apk \
            && printf '%s\n' \
                'server {' \
                '    listen 80;' \
                '    server_name _;' \
                '    location /downloads/android/ {' \
                '        root /usr/share/nginx/html;' \
                '        types { application/vnd.android.package-archive apk; }' \
                '    }' \
                '}' \
                > /etc/nginx/conf.d/default.conf
    networks:
      - e2e-net
