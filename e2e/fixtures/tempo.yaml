# Tempo for the e2e stack (#354): just enough to accept OTLP and answer
# `GET /api/traces/<id>`, which is what client-telemetry.spec.ts asserts on.
#
# Deliberately not a copy of mini-config's tempo.yaml. The thing under test is
# v-note's sidecar config, which IS the production file; this is only somewhere
# real for it to export to, so that the spec reads back what a real Tempo stored
# rather than what a stand-in was told.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # How long a trace sits in memory before it is flushed. Traces are queryable
  # by id straight from the ingester, so this does not gate the spec — it only
  # keeps a short-lived stack from holding everything until it is torn down.
  trace_idle_period: 1s
  max_block_duration: 5m

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
