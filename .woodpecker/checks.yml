# Checks workflow: the static gates. No step depends on another, so all of them
# start together and none holds up the build workflows.
#
# Push pipeline = four workflows: checks ∥ web ∥ android → deploy.
# Why workflows and not one file of `depends_on` steps: Woodpecker runs step
# dependencies as whole stages — a step starts only when *every* step of the
# previous dependency level has finished, not just the ones it names. In the old
# single build.yml that made build-web wait ~100s on the Rust tests and e2e-web
# ~138s on the API 36 emulator lane. Workflows run in parallel and share nothing;
# deploy.yml depends on all three.

when:
  - event: [push, manual]

steps:
  # Rust gates run inside BuildKit (Dockerfile.rust-ci) so they share build-web's
  # warm crate cache and keep their own compiled target dirs across pipelines —
  # a plain `rust:` step image started from nothing every time. Separate steps so
  # a lint failure reads as a lint failure. rust-test also needs a Postgres for the
  # `postgres-tests` feature; scripts/rust-ci-test.sh starts one beside the build.
  lint:
    depends_on: []
    image: &docker-image docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes: &docker-socket
      - /var/run/docker.sock:/var/run/docker.sock
    environment: &github-token
      # sovereign-config-provider is a git+tag dep on a private repo; the cargo
      # layers fetch it through this BuildKit secret.
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        START=$$(date +%s)
        docker build -f Dockerfile.rust-ci --target lint --output type=cacheonly \
          --secret id=github_token,env=GITHUB_TOKEN .
        echo "timing: rust-ci lint took $$(( $$(date +%s) - $$START ))s"

  rust-test:
    depends_on: []
    image: *docker-image
    volumes: *docker-socket
    environment: *github-token
    commands:
      - |
        START=$$(date +%s)
        ./scripts/rust-ci-test.sh
        echo "timing: rust-ci test took $$(( $$(date +%s) - $$START ))s"

  # deploy-v-note.sh takes no arguments: every environment-specific value is a
  # parameter set by the deploy steps in deploy.yml, so a missing one is not a
  # crash but a silently wrong deploy (a container mislabelled with the wrong env,
  # a parallel compose project, an app with no runtime config). The deploy steps
  # only ever exercise the happy path, so the guards get their own test. Runs on
  # the docker CLI image for the compose plugin — `compose config` resolves the
  # model client-side, so this needs no docker socket.
  #
  # local-compose-env.sh rides along (#400): it generates the local stack's
  # Postgres password once and must never regenerate it, and nothing in the
  # pipeline runs the local stack, so a regression would surface only as a dev box
  # that can no longer open its own database.
  deploy-script-validation:
    depends_on: []
    image: *docker-image
    commands:
      - ./scripts/test-deploy-v-note.sh
      - ./scripts/test-local-compose-env.sh

  # The blueprint is applied by CI to the shared Authentik, so a typo in it takes
  # down login for everyone and is found by the next person trying to sign in.
  # A repo-owned artifact CI applies to shared infrastructure deserves a check
  # that runs without that infrastructure: this validates the file parses, never
  # names another environment, and holds its own invariants (one public provider,
  # no secret, both redirect URIs, the #372 grant_types gate, retirements ordered
  # last). Its own step for the same reason as the Grafana one.
  authentik-blueprint-validation:
    depends_on: []
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    commands:
      - apk add --no-cache python3 py3-yaml bash
      - ./scripts/test-authentik-blueprints.sh

  # deploy.yml holds two paths chosen per step by `when`, and only Woodpecker
  # reads it — a step that drifts onto `push` redeploys shared dev from every
  # branch again (#462). This asserts the push path only builds, verifies and
  # tags, that everything touching dev runs on a `deployment` after the image
  # check, and that no dependency is pruned out from under a step.
  #
  # release-version.sh rides along: it computes the tag every image is built,
  # verified and deployed under, and pushes it — run here against a local bare
  # repository with real git, so a regression is found before it tags anything.
  deploy-pipeline-validation:
    depends_on: []
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    commands:
      - apk add --no-cache python3 py3-yaml bash git
      - ./scripts/test-deploy-pipeline.sh
      - ./scripts/test-release-version.sh

  # scripts/smoke-oidc-login.sh is the post-deploy gate #372 was missing, and it
  # runs only against live infrastructure — so a broken assertion in it would be
  # found by the next outage rather than by CI. This drives it against a local
  # stub IdP and asserts it both passes a healthy login and fails each way the
  # flow can break. curl is unpinned for the reason given on the Grafana steps.
  #
  # smoke-web-live.sh (#179), the authenticated half of the post-deploy smoke,
  # rides along for the same reason with the same tools: its test stubs npm/npx
  # and the app's /health, and asserts the driver refuses missing inputs, runs
  # the live config (never the mock-IdP suite) and never prints the password.
  oidc-login-smoke-validation:
    depends_on: []
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    commands:
      - apk add --no-cache python3 bash curl
      - ./scripts/test-smoke-oidc-login.sh
      - ./scripts/test-smoke-web-live.sh

  # Same argument for the two scripts #299 added, both of which only ever run
  # against live shared infrastructure:
  #
  # - smoke-sql-console.sh is the ONLY automated assertion that the SQL console
  #   is not publicly readable. No CI stack can make it (e2e has no Traefik and
  #   no Authentik), so a guard that silently passes would leave the database
  #   exposed with every check green.
  # - attach-sqltool-outpost.sh does a read-modify-write on the *shared* embedded
  #   outpost, whose provider list also holds every other service Authentik
  #   protects on this LAN. A bug that writes a short list detaches all of them.
  sql-console-script-validation:
    depends_on: []
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    commands:
      - apk add --no-cache python3 bash curl jq
      - ./scripts/test-smoke-sql-console.sh
      - ./scripts/test-attach-sqltool-outpost.sh

  # deploy.yml publishes the Grafana dashboard on every dev deployment, from any
  # branch, so a broken one would otherwise land straight on the shared dashboard. This
  # validates deploy/grafana/v-note-overview.json and the publish script's payload
  # without Grafana or a token. Its own step: the docker CLI image has no jq.
  # jq is unpinned for the reason given on publish-grafana-dashboard in deploy.yml.
  grafana-dashboard-validation:
    depends_on: []
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    commands:
      - apk add --no-cache jq
      - ./scripts/test-grafana-dashboard.sh

  # e2e/alloy/monitor-alloy.alloy — the stand-in for the shared Alloy every e2e
  # run exports through — parses and validates, on the Alloy image the e2e stack
  # runs, so a broken fixture fails here in seconds rather than as an e2e
  # timeout. (Until #439 this validated the client telemetry sidecar, now gone.)
  alloy-config-validation:
    depends_on: []
    image: grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    commands:
      - ./scripts/test-alloy-config.sh

  # Every file that names the android-build-box image must agree with
  # scripts/android-build-box-image.ref.
  android-build-box-pin:
    depends_on: []
    image: *docker-image
    commands:
      - ./scripts/check-android-build-box-image.sh
