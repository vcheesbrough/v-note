services:
  # Mock OIDC — wired for #146 auth e2e; tests skip auth setup when OIDC_TOKEN_URL is unset.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10@sha256:65d4ed47ce094cc3849e41e03499bfb32372d69c726ec22b3d5a19eba9bc787e
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "client_id",
                  "match": "v-note-test",
                  "claims": {
                    "sub": "v-note-test-service-account",
                    "aud": ["v-note-test"],
                    "scope": "openid profile email v-note:test:access",
                    "preferred_username": "test-user",
                    "email": "test@example.com"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-android-test",
                  "claims": {
                    "sub": "v-note-android-test-user",
                    "aud": ["v-note-android-test"],
                    "scope": "openid profile email v-note:test:access",
                    "preferred_username": "android-test-user",
                    "email": "android@example.com"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-test-wrong",
                  "claims": {
                    "sub": "wrong-scope-user",
                    "aud": ["v-note-test"],
                    "scope": "openid profile email v-note:wrong:access",
                    "preferred_username": "wrong-scope-user",
                    "email": "wrong@example.com"
                  }
                }
              ]
            }
          ]
        }
    networks:
      - e2e-net

  app:
    image: ${TEST_IMAGE:?TEST_IMAGE must be set}
    environment:
      APP_ENV: test
      APP_VERSION: test
      OIDC_ISSUER_URL: http://mock-oidc:8080/default
      OIDC_CLIENT_ID: v-note-test
      OIDC_CLIENT_SECRET: test-secret
      OIDC_REDIRECT_URI: https://app:443/auth/callback
      REQUIRED_SCOPE: v-note:test:access
      OIDC_ANDROID_CLIENT_ID: v-note-android-test
      OIDC_ANDROID_ISSUER_URL: http://mock-oidc:8080/default
    depends_on:
      - mock-oidc
    networks:
      - e2e-net

  playwright:
    image: v-note-e2e-playwright:${OCI_IMAGE_VERSION:-local}
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.54.2-jammy@sha256:948dc1e8601eeb152b31ef57959a74c2170be6fe875c33518bf33aea424d8940
        LABEL org.opencontainers.image.title="v-note-e2e-playwright" \
            org.opencontainers.image.description="v-note Playwright e2e test runner image" \
            org.opencontainers.image.licenses="PolyForm-Noncommercial-1.0.0" \
            org.opencontainers.image.url="https://github.com/vcheesbrough/v-note" \
            org.opencontainers.image.authors="Vincent Cheesbrough" \
            org.opencontainers.image.documentation="https://github.com/vcheesbrough/v-note/blob/master/docs/DEPLOY.md" \
            org.opencontainers.image.base.name="mcr.microsoft.com/playwright:v1.54.2-jammy" \
            org.opencontainers.image.base.digest="sha256:948dc1e8601eeb152b31ef57959a74c2170be6fe875c33518bf33aea424d8940"
        WORKDIR /e2e
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        CMD ["npx", "playwright", "test"]
      labels:
        org.opencontainers.image.version: ${OCI_IMAGE_VERSION:-local}
        org.opencontainers.image.revision: ${OCI_IMAGE_REVISION:-dev}
        org.opencontainers.image.source: https://github.com/vcheesbrough/v-note
        org.opencontainers.image.created: ${OCI_IMAGE_CREATED:-unknown}
    environment:
      BASE_URL: https://app:443
      OIDC_TOKEN_URL: http://mock-oidc:8080/default/token
      OIDC_CLIENT_ID: v-note-test
      OIDC_CLIENT_SECRET: test-secret
      REQUIRED_SCOPE: v-note:test:access
    volumes:
      - ${REPORT_DIR:-./playwright-report}:/e2e/playwright-report
    depends_on:
      - app
      - mock-oidc
    networks:
      - e2e-net

networks:
  e2e-net:
