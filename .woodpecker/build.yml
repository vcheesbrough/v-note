# Step DAG: set depends_on on any step to enable parallel execution (Woodpecker stages).
# Push: compute-version ∥ contract-validation ∥ build-android ∥ Android API 29/36 instrumented → build-web → e2e-web; all push gates → apply-authentik-blueprint-auto-dev → auto-deploy-dev → tag-release-auto-dev
# Deploy: validate-deployment ∥ compute-version ∥ apply-authentik-blueprint → deploy-* → tag-release

when:
  - event: [push, deployment, manual]

steps:
  compute-version:
    when:
      - event: [push, deployment, manual]
    depends_on: []
    pull: true
    image: &version-plugin ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.1.0@sha256:81a29c3a5785c146b5b3dfd7e0d8e7edb353b72e4e53bdbef4f7e13a88488c59
    settings:
      mode: compute
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  contract-validation:
    when:
      - event: [push, manual]
    depends_on: []
    image: rust:1.94.1@sha256:652612f07bfbbdfa3af34761c1e435094c00dde4a98036132fca28c7bb2b165c
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      # sovereign-config-provider is a git+tag dep on a private repo; cargo must be
      # able to resolve it even for workspace members that don't depend on it.
      - export CARGO_NET_GIT_FETCH_WITH_CLI=true
      - export GIT_CONFIG_COUNT=1
      - export GIT_CONFIG_KEY_0="url.https://x-access-token:$${GITHUB_TOKEN}@github.com/.insteadOf"
      - export GIT_CONFIG_VALUE_0="https://github.com/"
      - cargo test -p protocol
      - cargo test -p frontend
      - cargo test -p server
      - ./scripts/check-android-build-box-image.sh

  build-android:
    when:
      - event: [push, manual]
    depends_on:
      - compute-version
    # mingc/android-build-box as a Woodpecker step image does not attach stdout to logs.
    # docker run -v $CI_WORKSPACE fails when the agent workspace is a named volume, not a
    # host path — use docker build (context over API) like build-web.
    image: &docker-image docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes: &docker-socket
      - /var/run/docker.sock:/var/run/docker.sock
    environment: &registry-creds
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/v-note-android:$$RELEASE_TAG
        START=$$(date +%s)
        docker build -f Dockerfile.android \
          --build-arg ANDROID_BUILD_BOX_IMAGE=$$(cat scripts/android-build-box-image.ref) \
          --build-arg V_NOTE_RELEASE="$$RELEASE_TAG" \
          --label org.opencontainers.image.title=v-note-android \
          --label "org.opencontainers.image.description=v-note Android APK delivery image (nginx; devDebug APK for remote dev sideload)" \
          --label org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0 \
          --label org.opencontainers.image.url=https://github.com/vcheesbrough/v-note \
          --label org.opencontainers.image.authors="Vincent Cheesbrough" \
          --label org.opencontainers.image.vendor="Vincent Cheesbrough" \
          --label org.opencontainers.image.documentation=https://github.com/vcheesbrough/v-note/blob/master/docs/DEPLOY.md \
          --label org.opencontainers.image.base.name=nginx:alpine \
          --label org.opencontainers.image.base.digest=sha256:8b1e78743a03dbb2c95171cc58639fef29abc8816598e27fb910ed2e621e589a \
          --label org.opencontainers.image.version="$$RELEASE_TAG" \
          --label org.opencontainers.image.revision="$$CI_COMMIT_SHA" \
          --label org.opencontainers.image.source=https://github.com/vcheesbrough/v-note \
          --label org.opencontainers.image.created="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -t "$$IMAGE" .
        echo "timing: docker build Dockerfile.android took $$(( $$(date +%s) - $$START ))s"
        START=$$(date +%s)
        docker push "$$IMAGE"
        echo "timing: docker push $$IMAGE took $$(( $$(date +%s) - $$START ))s"

  android-instrumented-api-29:
    when:
      - event: [push, manual]
    depends_on:
      - compute-version
    image: *docker-image
    volumes: *docker-socket
    environment:
      ANDROID_API_LEVEL: "29"
    commands: &android-instrumented-commands
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=v-note-android-instrumented:$$CI_COMMIT_SHA-api$$ANDROID_API_LEVEL
        START=$$(date +%s)
        docker build -f Dockerfile.android-instrumented \
          --build-arg ANDROID_BUILD_BOX_IMAGE=$$(cat scripts/android-build-box-image.ref) \
          --build-arg ANDROID_API_LEVEL="$$ANDROID_API_LEVEL" \
          --build-arg V_NOTE_RELEASE="$$RELEASE_TAG" \
          --label org.opencontainers.image.title=v-note-android-instrumented \
          --label "org.opencontainers.image.description=v-note Android API $$ANDROID_API_LEVEL CI image (devDebug instrumented tests + emulator)" \
          --label org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0 \
          --label org.opencontainers.image.url=https://github.com/vcheesbrough/v-note \
          --label org.opencontainers.image.documentation=https://github.com/vcheesbrough/v-note/blob/master/docs/DEPLOY.md \
          --label org.opencontainers.image.base.name=mingc/android-build-box:master \
          --label org.opencontainers.image.base.digest=sha256:6644d9869eeecf26bc80894d00540483139f52f4aa8668c9f4ee873c82dd054c \
          --label org.opencontainers.image.version="$$RELEASE_TAG" \
          --label org.opencontainers.image.revision="$$CI_COMMIT_SHA" \
          --label org.opencontainers.image.source=https://github.com/vcheesbrough/v-note \
          --label org.opencontainers.image.created="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -t "$$IMAGE" .
        echo "timing: docker build Dockerfile.android-instrumented took $$(( $$(date +%s) - $$START ))s"
      - |
        START=$$(date +%s)
        if [ -c /dev/kvm ]; then
          docker run --rm --privileged --device=/dev/kvm v-note-android-instrumented:$$CI_COMMIT_SHA-api$$ANDROID_API_LEVEL
        else
          docker run --rm --privileged v-note-android-instrumented:$$CI_COMMIT_SHA-api$$ANDROID_API_LEVEL
        fi
        echo "timing: Android API $$ANDROID_API_LEVEL instrumented docker run took $$(( $$(date +%s) - $$START ))s"

  android-instrumented-api-36:
    when:
      - event: [push, manual]
    depends_on:
      - compute-version
    image: *docker-image
    volumes: *docker-socket
    environment:
      ANDROID_API_LEVEL: "36"
    commands: *android-instrumented-commands

  build-web:
    when:
      - event: [push, manual]
    depends_on:
      - compute-version
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      # Needed by the cargo layers to fetch the private sovereign-config git dep.
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/v-note:$$RELEASE_TAG
        START=$$(date +%s)
        docker build -f Dockerfile.web \
          --secret id=github_token,env=GITHUB_TOKEN \
          --build-arg V_NOTE_RELEASE="$$RELEASE_TAG" \
          --label org.opencontainers.image.title=v-note \
          --label "org.opencontainers.image.description=v-note server (Axum API + Leptos SPA static)" \
          --label org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0 \
          --label org.opencontainers.image.url=https://github.com/vcheesbrough/v-note \
          --label org.opencontainers.image.documentation=https://github.com/vcheesbrough/v-note/blob/master/docs/DEPLOY.md \
          --label org.opencontainers.image.base.name=debian:trixie-slim \
          --label org.opencontainers.image.base.digest=sha256:b6e2a152f22a40ff69d92cb397223c906017e1391a73c952b588e51af8883bf8 \
          --label org.opencontainers.image.version="$$RELEASE_TAG" \
          --label org.opencontainers.image.revision="$$CI_COMMIT_SHA" \
          --label org.opencontainers.image.source=https://github.com/vcheesbrough/v-note \
          --label org.opencontainers.image.created="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -t "$$IMAGE" .
        echo "timing: docker build Dockerfile.web took $$(( $$(date +%s) - $$START ))s"
        START=$$(date +%s)
        docker push "$$IMAGE"
        echo "timing: docker push $$IMAGE took $$(( $$(date +%s) - $$START ))s"

  e2e-web:
    when:
      - event: [push, manual]
    depends_on:
      - build-web
    image: *docker-image
    volumes: *docker-socket
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        export OCI_IMAGE_VERSION="$$RELEASE_TAG"
        export OCI_IMAGE_REVISION="$$CI_COMMIT_SHA"
        export OCI_IMAGE_CREATED="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        REPORT=/srv/dev/playwright-reports/v-note-$$CI_PIPELINE_NUMBER--$(echo $$CI_COMMIT_BRANCH | tr '/' '-')--$(echo $$CI_COMMIT_SHA | cut -c1-7)
        START=$$(date +%s)
        TEST_IMAGE="registry.desync.link/v-note:$$RELEASE_TAG" docker compose -f e2e/docker-compose.test.yml -f e2e/docker-compose.android-apk.test.yml build playwright v-note-android-apk legacy-migration-fixture
        echo "timing: e2e support image build took $$(( $$(date +%s) - $$START ))s"
        ./scripts/check-image-metadata.sh "v-note-e2e-playwright:$$RELEASE_TAG" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
        START=$$(date +%s)
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/v-note:$$RELEASE_TAG docker compose -f e2e/docker-compose.test.yml -f e2e/docker-compose.android-apk.test.yml up --force-recreate --abort-on-container-exit --exit-code-from playwright && RC=0 || RC=$$?
        echo "timing: e2e compose up took $$(( $$(date +%s) - $$START ))s"
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/v-note:$$RELEASE_TAG docker compose -f e2e/docker-compose.test.yml -f e2e/docker-compose.android-apk.test.yml down --volumes
        echo "Test report: $$REPORT/index.html"
        exit $$RC

  validate-deployment:
    when:
      - event: deployment
    depends_on: []
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    commands:
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" != "dev" ] && [ "$$CI_PIPELINE_DEPLOY_TARGET" != "prod" ]; then
          echo "ERROR: deploy target must be 'dev' or 'prod' (got: '$$CI_PIPELINE_DEPLOY_TARGET')"
          exit 1
        fi
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" = "prod" ] && [ "$$CI_COMMIT_BRANCH" != "master" ]; then
          echo "ERROR: prod can only be deployed from master (current branch: '$$CI_COMMIT_BRANCH')"
          exit 1
        fi

  apply-authentik-blueprint:
    when:
      - event: deployment
    depends_on: 
      - validate-deployment
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0@sha256:9f262c4390205b5629e9af7560f4e492f0155395a429153703ba351206d9d975
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint.yaml
      instance_name: v-note
      timeout_seconds: 900
      vars:
        AUTHENTIK_V_NOTE_DEV_CLIENT_SECRET:
          from_secret: v_note_dev_oidc_client_secret
        AUTHENTIK_V_NOTE_PROD_CLIENT_SECRET:
          from_secret: v_note_prod_oidc_client_secret

  apply-authentik-blueprint-auto-dev:
    when:
      - event: push
    depends_on:
      - contract-validation
      - build-android
      - android-instrumented-api-29
      - android-instrumented-api-36
      - e2e-web
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0@sha256:9f262c4390205b5629e9af7560f4e492f0155395a429153703ba351206d9d975
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint.yaml
      instance_name: v-note
      timeout_seconds: 900
      vars:
        AUTHENTIK_V_NOTE_DEV_CLIENT_SECRET:
          from_secret: v_note_dev_oidc_client_secret
        AUTHENTIK_V_NOTE_PROD_CLIENT_SECRET:
          from_secret: v_note_prod_oidc_client_secret

  deploy-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - validate-deployment
      - compute-version
      - apply-authentik-blueprint
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      POSTGRES_PASSWORD:
        from_secret: v_note_dev_postgres_password
      # Unlocks the /applications/v-note/dev sovereign-config subtree; the URL
      # itself selects the environment.
      SOVEREIGN_CONFIG_ACCESS_URL_FILE:
        from_secret: v_note_dev_sovereign_access_url
    commands:
      - ./scripts/deploy-v-note.sh dev

  auto-deploy-dev:
    when:
      - event: push
    depends_on:
      - compute-version
      - apply-authentik-blueprint-auto-dev
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      POSTGRES_PASSWORD:
        from_secret: v_note_dev_postgres_password
      # Unlocks the /applications/v-note/dev sovereign-config subtree; the URL
      # itself selects the environment.
      SOVEREIGN_CONFIG_ACCESS_URL_FILE:
        from_secret: v_note_dev_sovereign_access_url
    commands:
      - ./scripts/deploy-v-note.sh dev

  tag-release-auto-dev-0.13.0:
    when:
      - event: push
    depends_on:
      - auto-deploy-dev
    pull: true
    image: *version-plugin
    settings:
      mode: push-tag
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  deploy-prod:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    depends_on:
      - validate-deployment
      - compute-version
      - apply-authentik-blueprint
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      POSTGRES_PASSWORD:
        from_secret: v_note_prod_postgres_password
      # Unlocks the /applications/v-note/prod sovereign-config subtree.
      SOVEREIGN_CONFIG_ACCESS_URL_FILE:
        from_secret: v_note_prod_sovereign_access_url
    commands:
      - ./scripts/deploy-v-note.sh prod

  tag-release-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - deploy-dev
    pull: true
    image: *version-plugin
    settings: &push-tag-settings
      mode: push-tag
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  tag-release-prod:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    depends_on:
      - deploy-prod
    pull: true
    image: *version-plugin
    settings: *push-tag-settings
