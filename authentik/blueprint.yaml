version: 1
metadata:
  name: v-note OIDC
  labels:
    blueprints.goauthentik.io/description: "v-note OAuth2 providers (dev + prod) and access scopes"

entries:
  - model: authentik_core.group
    state: present
    identifiers:
      name: v-note-dev-users
    attrs:
      name: v-note-dev-users

  - model: authentik_core.group
    state: present
    identifiers:
      name: v-note-prod-users
    attrs:
      name: v-note-prod-users

  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: "v-note:dev:access"
    attrs:
      name: "v-note:dev:access"
      scope_name: "v-note:dev:access"
      description: "Grants access to v-note dev"
      expression: |
        return {}

  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: "v-note:prod:access"
    attrs:
      name: "v-note:prod:access"
      scope_name: "v-note:prod:access"
      description: "Grants access to v-note prod"
      expression: |
        return {}

  # One **public** provider per environment serves both the SPA and the Android
  # app (#274). Both clients run Authorization Code + PKCE, so neither holds a
  # secret — a native app cannot keep one, and the server-side browser exchange
  # is bound by the PKCE verifier instead. Because the provider carries both
  # redirect URIs, every token now has a single `aud` and a single `iss`, which
  # is what let the server drop its dual-audience logic.
  #
  # The issuer is derived from the **application slug**, so keeping the slugs
  # `v-note-dev` / `v-note-prod` leaves the browser issuer unchanged and moves
  # only Android onto it.
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: v-note-dev
    attrs:
      name: v-note-dev
      client_id: v-note-dev
      client_type: public
      redirect_uris:
        - url: "https://v-notes-dev.desync.link/auth/callback"
          matching_mode: strict
        - url: "https://v-notes-dev.desync.link/auth/mobile/callback"
          matching_mode: strict
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "v-note:dev:access"]]

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: v-note-prod
    attrs:
      name: v-note-prod
      client_id: v-note-prod
      client_type: public
      redirect_uris:
        - url: "https://v-notes.desync.link/auth/callback"
          matching_mode: strict
        - url: "https://v-notes.desync.link/auth/mobile/callback"
          matching_mode: strict
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "v-note:prod:access"]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: v-note-dev
    attrs:
      name: v-note (dev)
      slug: v-note-dev
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, v-note-dev]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: v-note-prod
    attrs:
      name: v-note (prod)
      slug: v-note-prod
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, v-note-prod]]


  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !Find [authentik_core.application, [slug, v-note-dev]]
      group: !Find [authentik_core.group, [name, v-note-dev-users]]
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30
      target: !Find [authentik_core.application, [slug, v-note-dev]]
      group: !Find [authentik_core.group, [name, v-note-dev-users]]

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !Find [authentik_core.application, [slug, v-note-prod]]
      group: !Find [authentik_core.group, [name, v-note-prod-users]]
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30
      target: !Find [authentik_core.application, [slug, v-note-prod]]
      group: !Find [authentik_core.group, [name, v-note-prod-users]]

  # -------------------------------------------------------------------------
  # Retired by #274 — the separate Android applications and the old confidential
  # browser providers. Ordered after the entries above so the applications are
  # already repointed at the unified providers before these are deleted.
  #
  # Blueprint identity is `name`/`slug`, so the browser providers are *renamed*
  # (v-note-browser-{dev,prod} → v-note-{dev,prod}) rather than edited in place;
  # without these the old confidential objects would survive as orphans, still
  # holding a usable client secret.
  # -------------------------------------------------------------------------

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: v-note-android-dev

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: v-note-android-prod

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: v-note-android-dev

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: v-note-android-prod

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: v-note-browser-dev

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: v-note-browser-prod
