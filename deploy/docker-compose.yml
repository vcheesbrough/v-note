# Mini deploy (Woodpecker, default): Traefik on proxy-backend, LAN/VPN middleware, no host ports.
# Local temporary dev: add -f deploy/docker-compose.local.yml (published :8443, no Traefik).

services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    environment:
      POSTGRES_DB: v_note
      POSTGRES_USER: v_note
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (deploy/.env locally, rendered from /v-note/devops/<env>/compose in CI)}
    volumes:
      - v-note-db:/var/lib/postgresql/data
    networks:
      - v-note-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v_note -d v_note"]
      interval: 5s
      timeout: 5s
      retries: 5

  v-note:
    # No `build:` here on purpose: this file defines production and the web image
    # has a canonical CI build (.woodpecker/web.yml `build-web`). Compose may
    # build images that exist only for one stack (the e2e Playwright and
    # legacy-migration fixtures) — never the deployed application image. Local
    # dev builds the same image with the same Dockerfile via `just run-compose`.
    image: registry.desync.link/v-note:${V_NOTE_IMAGE_TAG:-local}
    container_name: ${V_NOTE_CONTAINER_NAME:?V_NOTE_CONTAINER_NAME is required}
    restart: unless-stopped
    environment:
      # Runtime config (database / oidc / observability / android) comes from
      # sovereign-config, reached via the access-URL secret below — including
      # `observability/metrics-addr`, which the deploy step reads through its own
      # /v-note/devops/<env>/compose layer to derive the Alloy scrape labels
      # further down.
      # Set to an empty value (docker-compose.local.yml) to disable the
      # sovereign-config layer and fall back to plain VNOTE__* env.
      # Points at the docker secret below; the provider reads the URL from that file.
      SOVEREIGN_CONFIG_ACCESS_URL_FILE: /run/secrets/SOVEREIGN_CONFIG_ACCESS_URL_FILE
    secrets:
      - SOVEREIGN_CONFIG_ACCESS_URL_FILE
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - v-note-net
      - proxy-backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}.entrypoints=websecure
      # `:?` here is the only thing that makes V_NOTE_HOST required: it is a
      # compose-level variable (Traefik routing), never container env, so an
      # unset value would otherwise resolve to an unroutable Host(``).
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}.rule=Host(`${V_NOTE_HOST:?V_NOTE_HOST is required}`)
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}.tls=true
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}.tls.certresolver=myresolver
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}.middlewares=lan-vpn-only@docker,rate-limit@docker,security-headers@docker
      - traefik.http.services.${V_NOTE_CONTAINER_NAME}.loadbalancer.server.port=443
      - traefik.http.services.${V_NOTE_CONTAINER_NAME}.loadbalancer.server.scheme=https
      # Derived by deploy-v-note.sh from the one `observability/metrics-addr`
      # value the app itself reads, so the listener and the thing scraping it
      # cannot disagree. Written by docker at container-create time, which is why
      # they must be resolved outside the container.
      - observability.metrics.scrape=${V_NOTE_METRICS_SCRAPE:-true}
      - observability.metrics.port=${V_NOTE_METRICS_PORT:-9090}
      - observability.metrics.path=/metrics
      - observability.metrics.scheme=http
      - observability.service=v-note
      - observability.deployment.environment=${APP_ENV:-dev}
      - observability.release=${APP_VERSION:-unknown}
      # No `observability.protocol` label: the protocol version is a compile-time
      # constant, not configuration. `v_note_build_info{protocol=…}` states it
      # from the same constant the binary uses and cannot go stale. Join with
      # `… * on(instance) group_left(protocol) v_note_build_info` to filter.

  # Read-only SQL console (#299). Off unless COMPOSE_PROFILES names `sqltool`,
  # which the dev deploy step sets and nothing else does.
  #
  # No `build:`, and pinned by digest exactly as postgres is — this is a
  # third-party image reached over the network, and a floating tag would let a
  # rebuild change what has database access.
  sqltool:
    profiles: [sqltool]
    image: sosedoff/pgweb@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    restart: unless-stopped
    environment:
      # 🚫 No `:-` default anywhere in this block. The obvious convenience —
      # falling back to POSTGRES_PASSWORD — hands the console the application's
      # **superuser** credentials, which turns pgweb's "read-only" mode into
      # arbitrary host-file read (see the migration's header). There is no
      # degraded mode.
      #
      # ⚠️ And no `:?` guard either, which is NOT an oversight — do not "fix" it.
      # Compose interpolates the whole file *before* it filters by profile, so a
      # `:?` here fails `docker compose config` even when this service is
      # switched off, breaking every deploy that does not run the console (and
      # local compose, and the test harness). Verified against this compose
      # version. The guard lives in deploy-v-note.sh instead, where it can be
      # conditional on the profile actually being active — same loud failure,
      # applied only when it means something.
      PGWEB_DATABASE_URL: postgres://v_note_pgweb:${PGWEB_DB_PASSWORD}@postgres:5432/v_note?sslmode=disable
      PGWEB_URL_PREFIX: dbconsole
      # Locks the session to the connection string above. Verified on the #299
      # spike: POST /api/connect and /api/disconnect both return
      # `{"error":"Session is locked"}`, so there is no browser path from the
      # console to another role or database.
      PGWEB_LOCK_SESSION: "1"
      # Deliberately NOT set: PGWEB_SESSIONS re-opens the connection screen,
      # which is the one thing that would undo the lock above.
      #
      # The basic-auth backstop. authentik is the identity gate (see the routers
      # below); this is what keeps the console closed at the *application* layer
      # if the outpost is down, the provider is misconfigured, or the profile is
      # ever enabled somewhere no auth is attached. Traefik injects the matching
      # header after authentik approves, so nobody is prompted for it.
      # Guarded in deploy-v-note.sh, not here — see the note above.
      PGWEB_AUTH_USER: ${PGWEB_AUTH_USER}
      PGWEB_AUTH_PASS: ${PGWEB_AUTH_PASS}
    # Only these six have PGWEB_* env vars (confirmed against `pgweb --help` for
    # this digest); everything else has to be a flag.
    command:
      - --bind=0.0.0.0
      - --listen=8081
      - --readonly
      - --skip-open
      - --log-format=json
      # Logs X-Forwarded-User when present. The mini-config authentik middleware
      # forwards X-authentik-username and not that header, so this currently
      # records nothing — it is set so that identity appears here the day the
      # middleware does forward it, rather than being a change nobody remembers.
      - --log-forwarded-user
      - --metrics
      - --metrics-addr=0.0.0.0:9191
      - --metrics-path=/metrics
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - v-note-net
      - proxy-backend
    # Asserts liveness *and* that the basic-auth gate is on, in one probe: an
    # unauthenticated request must be refused. If auth were ever accidentally
    # disabled this goes green->red rather than silently serving the console.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/dbconsole/api/info | grep -q 401"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      - traefik.enable=true

      # --- router 1: the console itself ---------------------------------
      # Traefik's default priority is rule length, so `Host(…) && PathPrefix(…)`
      # already outranks the app's bare `Host(…)`. Set explicitly anyway: the
      # app serving the console's URL instead is a silent failure, not a loud one.
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool.entrypoints=websecure
      # V_NOTE_HOST carries its `:?` on the app service, which is not profiled and
      # so always fires — no need to repeat it here (and see the env note above
      # for why repeating it would be actively wrong).
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool.rule=Host(`${V_NOTE_HOST}`) && PathPrefix(`/dbconsole`)
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool.priority=100
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool.tls=true
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool.tls.certresolver=myresolver
      # Middlewares are per router — `lan-vpn-only@docker` does NOT carry over
      # from the app's router and has to be repeated. Order matters: a denied
      # forward-auth short-circuits the chain, so the credential injector below
      # only ever runs on a request authentik has already approved.
      #
      # `security-headers@docker` is deliberately absent: its CSP has no
      # `unsafe-eval` and pgweb bundles the Ace editor. Add it once the UI is
      # confirmed to survive it.
      #
      # `rate-limit@docker` IS carried, and matters more here than on the app
      # router: /dbconsole/api/query runs arbitrary SQL whose only cost control
      # is this role's 30s statement_timeout, so a loop of 30-second seq scans
      # is a self-inflicted DoS on the application's own database — from an
      # already-authenticated session.
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool.middlewares=lan-vpn-only@docker,rate-limit@docker,authentik@docker,${V_NOTE_CONTAINER_NAME}-sqltool-auth@docker
      - traefik.http.services.${V_NOTE_CONTAINER_NAME}-sqltool.loadbalancer.server.port=8081

      # --- router 2: the forward-auth callback --------------------------
      # Load-bearing, and the least obvious thing in this file.
      #
      # authentik builds its callback from the provider's *hostname* and
      # discards any path — probed on #299: an externalHost of
      # `https://<host>/dbconsole` still emits
      # `https://<host>/outpost.goauthentik.io/callback`. That URL does not start
      # with /dbconsole, so without this router it matches the **app's** router,
      # which has no authentik middleware; the SPA's catch-all serves index.html,
      # the session cookie is never set, and login loops forever.
      #
      # Every mini-config service protected this way (glances, woodpecker, the
      # Traefik dashboard) is a bare `Host(…)` router, which catches the callback
      # by accident. A path-scoped console has to catch it on purpose.
      #
      # The backend is irrelevant — `authentik@docker` intercepts these requests
      # and answers them itself, so nothing is ever proxied to pgweb. It points
      # at this service only because a Traefik router needs one.
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool-callback.entrypoints=websecure
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool-callback.rule=Host(`${V_NOTE_HOST}`) && PathPrefix(`/outpost.goauthentik.io`)
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool-callback.priority=100
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool-callback.tls=true
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool-callback.tls.certresolver=myresolver
      # No credential injector here: this router never reaches pgweb.
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool-callback.middlewares=lan-vpn-only@docker,authentik@docker
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}-sqltool-callback.service=${V_NOTE_CONTAINER_NAME}-sqltool

      # --- the credential injector --------------------------------------
      # Satisfies pgweb's own basic auth on behalf of an already-authenticated
      # user, so the backstop costs nobody a second password prompt.
      # `customRequestHeaders` *overwrites*, so a client that sends its own
      # Authorization header has it replaced rather than honoured — there is no
      # bypass surface here.
      #
      # Derived by deploy-v-note.sh from PGWEB_AUTH_USER/PGWEB_AUTH_PASS above,
      # so the header and the credential pgweb checks cannot drift apart.
      - traefik.http.middlewares.${V_NOTE_CONTAINER_NAME}-sqltool-auth.headers.customrequestheaders.Authorization=Basic ${PGWEB_AUTH_B64}

      # Scraped by Alloy exactly as the app is. Charted nowhere: the dashboard
      # validator (scripts/test-grafana-dashboard.sh) rejects any charted
      # `v_note_*` metric not registered in observability.rs, and pgweb's metric
      # names are not v-note's.
      - observability.metrics.scrape=true
      - observability.metrics.port=9191
      - observability.metrics.path=/metrics
      - observability.metrics.scheme=http
      - observability.service=v-note-sql-console
      - observability.deployment.environment=${APP_ENV:-dev}
      - observability.release=${APP_VERSION:-unknown}

  # Client telemetry sidecar (#354): receives the SPA's (and, from #406, the
  # Android app's) OTLP traces and logs, rewrites what they claim about their
  # origin, and exports to Tempo and Loki. See deploy/alloy/client-telemetry.alloy
  # for why it exists at all rather than the app forwarding straight to Tempo.
  #
  # 🚫 No Traefik labels, and that is the design — not an omission. This service
  # has no ingress. The app authenticates an export and proxies it here
  # (`/otlp/{client}/v1/{signal}`), so the only caller is a process that has
  # already checked the session. Routing it through Traefik would expose an
  # unauthenticated OTLP endpoint to the whole LAN/VPN range.
  #
  # Not behind a profile and not in deploy-v-note.sh's readiness gate: it is
  # inert until `client-telemetry.enabled` is set, and telemetry
  # must never be able to fail a deploy of the product.
  v-note-alloy:
    # Same digest as mini-config's monitoring-stack Alloy, so there is one Alloy
    # version to reason about on this host. Bump them together.
    image: grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    # The app addresses the sidecar by THIS name, not by the service name.
    # Compose aliases a service name onto every network the service joins, and
    # `proxy-backend` is shared by every environment on the host — so once a
    # second environment exists (#388), `v-note-alloy` there resolves to both
    # stacks' sidecars and Docker DNS round-robins between them. The container
    # name carries the environment, exactly as the app's does.
    container_name: ${V_NOTE_CONTAINER_NAME}-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/client-telemetry.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      # The pipeline keeps no state worth persisting (no WAL, no positions), so
      # this only has to be writable, and /tmp is the tmpfs below.
      - --storage.path=/tmp/alloy
    environment:
      # The same two values the observability.* labels use, so what the sidecar
      # stamps on client telemetry and what Alloy scrapes off the app's labels
      # cannot disagree.
      APP_ENV: ${APP_ENV:-dev}
      APP_VERSION: ${APP_VERSION:-unknown}
      # Exported direct to the backends, not via monitor-alloy:4317 — that
      # receiver forwards traces only and would silently drop logs (#354 Q1).
      # `host:port` for OTLP/gRPC; a base URL for OTLP/HTTP (the exporter
      # appends /v1/logs).
      CLIENT_TELEMETRY_TEMPO_ENDPOINT: ${CLIENT_TELEMETRY_TEMPO_ENDPOINT:-monitor-tempo:4317}
      CLIENT_TELEMETRY_LOKI_ENDPOINT: ${CLIENT_TELEMETRY_LOKI_ENDPOINT:-http://monitor-loki:3100/otlp}
    configs:
      - source: client_telemetry_alloy
        target: /etc/alloy/client-telemetry.alloy
    # It parses input that originated on a client, so it gets the hardening the
    # rest of this file does not bother with. None of it is load-bearing for the
    # pipeline: no state, no privileged port, nothing written outside /tmp.
    #
    # `read_only: true` is absent because it cannot be combined with the config
    # below: compose delivers an `environment:`-sourced config by writing it into
    # the container's filesystem over the API, and refuses to on a read-only
    # rootfs ("`file` is the sole supported option"). A `file:` source is the
    # bind mount this stack cannot use — see `configs:` at the bottom.
    user: "65534:65534"
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Above the config's memory_limiter (64 MiB + 16 MiB spike) plus the ~60 MiB
    # the process idles at, so the limiter refuses data before the OOM killer
    # acts. Measured on #354.
    mem_limit: 192m
    networks:
      - v-note-net
      - proxy-backend
    # Probes the two OTLP receivers, NOT Alloy's own /-/ready. An *unset*
    # CLIENT_TELEMETRY_ALLOY_CONFIG is loud — `up` refuses to start — but a
    # set-and-empty one (a `$(cat …)` that failed without `set -e`) delivers an
    # empty file, and Alloy is perfectly "ready" running an empty config. So
    # readiness would be green on a sidecar that accepts nothing. The ports only
    # listen once the real pipeline has loaded. bash's /dev/tcp because the image
    # ships no curl, wget or nc.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4318 && exec 4<>/dev/tcp/127.0.0.1/4319"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=false
      # Alloy's own metrics (receiver accepted/refused, exporter sent/failed).
      # Scraped like the app's; charted nowhere, for the reason given on sqltool.
      - observability.metrics.scrape=true
      - observability.metrics.port=12345
      - observability.metrics.path=/metrics
      - observability.metrics.scheme=http
      - observability.service=v-note-client-telemetry
      - observability.deployment.environment=${APP_ENV:-dev}
      - observability.release=${APP_VERSION:-unknown}

configs:
  # The committed deploy/alloy/client-telemetry.alloy, delivered through the
  # Docker API rather than bind-mounted — the same mechanism, for the same
  # reason, as the secret below. The deploy step runs compose inside a CI
  # container against the host's socket, so a bind-mount source is resolved on
  # the *host*, where the CI workspace does not exist; Docker then creates the
  # missing path as an empty directory and the sidecar fails to start.
  #
  # Verified byte-exact: compose does not interpolate an `environment:` source,
  # so the file's backticks, `%s` and quotes arrive untouched.
  #
  # deploy-v-note.sh fills this from the file; `just run-compose` does likewise.
  client_telemetry_alloy:
    environment: CLIENT_TELEMETRY_ALLOY_CONFIG

secrets:
  # Sourced straight from /v-note/devops/<env>/compose/SOVEREIGN_CONFIG_ACCESS_URL_FILE,
  # which `sovereign-config render` puts in the deploy step's environment (#391). Compose
  # materialises it as a file mounted at /run/secrets/SOVEREIGN_CONFIG_ACCESS_URL_FILE.
  # The connection URL is itself a secret and selects the env: which environment's
  # config the server reads is decided by *which* URL is injected, not by anything
  # in this file. The local overlay drops this mount and blanks the env
  # var to disable the sovereign layer entirely.
  SOVEREIGN_CONFIG_ACCESS_URL_FILE:
    environment: SOVEREIGN_CONFIG_ACCESS_URL_FILE

volumes:
  v-note-db:
    name: ${DB_VOLUME:?DB_VOLUME is required}
    external: true

networks:
  v-note-net:
    name: ${DOCKER_NETWORK:-v-note-net}
  proxy-backend:
    external: true
