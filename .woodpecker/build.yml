# Step DAG: set depends_on on any step to enable parallel execution (Woodpecker stages).
# Push: compute-version ∥ contract-validation ∥ build-android → build-web → e2e-web
# Deploy: validate-deployment ∥ compute-version ∥ apply-authentik-blueprint → deploy-* → tag-release (prod)

when:
  - event: [push, deployment]

steps:
  compute-version:
    when:
      - event: [push, deployment]
    depends_on: []
    pull: true
    image: &version-plugin ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.1.0@sha256:81a29c3a5785c146b5b3dfd7e0d8e7edb353b72e4e53bdbef4f7e13a88488c59
    settings:
      mode: compute
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  contract-validation:
    when:
      - event: push
    depends_on: []
    image: rust:1.89.0@sha256:57407b378b2b6e07b48a6135a20c87cc22ea6e249c0acf6cb1833ead3cf116e9
    commands:
      - cargo test -p protocol

  build-android:
    when:
      - event: push
    depends_on:
      - compute-version
    # mingc/android-build-box as a Woodpecker step image does not attach stdout to logs.
    # docker run -v $CI_WORKSPACE fails when the agent workspace is a named volume, not a
    # host path — use docker build (context over API) like build-web.
    image: &docker-image docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes: &docker-socket
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -f Dockerfile.android -t v-note-android:$$CI_COMMIT_SHA .

  build-web:
    when:
      - event: push
    depends_on:
      - compute-version
    image: *docker-image
    volumes: *docker-socket
    environment: &registry-creds
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - docker build -t registry.desync.link/v-note:$(cat .release-tag) .
      - docker push registry.desync.link/v-note:$(cat .release-tag)

  e2e-web:
    when:
      - event: push
    depends_on:
      - build-web
    image: *docker-image
    volumes: *docker-socket
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        REPORT=/srv/dev/playwright-reports/v-note-$$CI_PIPELINE_NUMBER--$(echo $$CI_COMMIT_BRANCH | tr '/' '-')--$(echo $$CI_COMMIT_SHA | cut -c1-7)
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/v-note:$$RELEASE_TAG docker compose -f e2e/docker-compose.test.yml up --build --force-recreate --abort-on-container-exit --exit-code-from playwright && RC=0 || RC=$$?
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/v-note:$$RELEASE_TAG docker compose -f e2e/docker-compose.test.yml down --volumes
        echo "Test report: $$REPORT/index.html"
        exit $$RC

  validate-deployment:
    when:
      - event: deployment
    depends_on: []
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    commands:
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" != "dev" ] && [ "$$CI_PIPELINE_DEPLOY_TARGET" != "prod" ]; then
          echo "ERROR: deploy target must be 'dev' or 'prod' (got: '$$CI_PIPELINE_DEPLOY_TARGET')"
          exit 1
        fi
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" = "prod" ] && [ "$$CI_COMMIT_BRANCH" != "master" ]; then
          echo "ERROR: prod can only be deployed from master (current branch: '$$CI_COMMIT_BRANCH')"
          exit 1
        fi

  apply-authentik-blueprint:
    when:
      - event: deployment
    depends_on: 
      - validate-deployment
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0@sha256:9f262c4390205b5629e9af7560f4e492f0155395a429153703ba351206d9d975
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint.yaml
      instance_name: v-note
      timeout_seconds: 900
      vars:
        AUTHENTIK_V_NOTE_DEV_CLIENT_SECRET:
          from_secret: v_note_dev_oidc_client_secret
        AUTHENTIK_V_NOTE_PROD_CLIENT_SECRET:
          from_secret: v_note_prod_oidc_client_secret

  deploy-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - validate-deployment
      - compute-version
      - apply-authentik-blueprint
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      OIDC_CLIENT_SECRET:
        from_secret: v_note_dev_oidc_client_secret
      POSTGRES_PASSWORD:
        from_secret: v_note_dev_postgres_password
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - docker volume create v-note-dev-db
      - |
        V_NOTE_IMAGE_TAG=$(cat .release-tag) APP_VERSION=$(cat .release-tag) \
        APP_ENV=$$CI_COMMIT_BRANCH V_NOTE_HOST=v-notes-dev.desync.link \
        V_NOTE_CONTAINER_NAME=v-note-dev DB_VOLUME=v-note-dev-db \
        POSTGRES_PASSWORD=$$POSTGRES_PASSWORD \
        OIDC_ISSUER_URL=https://auth.desync.link/application/o/v-note-dev/ \
        OIDC_CLIENT_ID=v-note-browser-dev \
        OIDC_CLIENT_SECRET=$$OIDC_CLIENT_SECRET \
        OIDC_REDIRECT_URI=https://v-notes-dev.desync.link/auth/callback \
        REQUIRED_SCOPE=v-note:dev:access \
        OIDC_END_SESSION_URL=https://auth.desync.link/application/o/v-note-dev/end-session/ \
        OIDC_ANDROID_CLIENT_ID=v-note-android-dev \
        OIDC_ANDROID_ISSUER_URL=https://auth.desync.link/application/o/v-note-android-dev/ \
        docker compose -p v-note-dev -f deploy/docker-compose.yml up -d

  deploy-prod:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    depends_on:
      - validate-deployment
      - compute-version
      - apply-authentik-blueprint
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      OIDC_CLIENT_SECRET:
        from_secret: v_note_prod_oidc_client_secret
      POSTGRES_PASSWORD:
        from_secret: v_note_prod_postgres_password
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - docker volume create v-note-prod-db
      - |
        V_NOTE_IMAGE_TAG=$(cat .release-tag) APP_VERSION=$(cat .release-tag) \
        APP_ENV=production V_NOTE_HOST=v-notes.desync.link \
        V_NOTE_CONTAINER_NAME=v-note DB_VOLUME=v-note-prod-db \
        POSTGRES_PASSWORD=$$POSTGRES_PASSWORD \
        OIDC_ISSUER_URL=https://auth.desync.link/application/o/v-note-prod/ \
        OIDC_CLIENT_ID=v-note-browser-prod \
        OIDC_CLIENT_SECRET=$$OIDC_CLIENT_SECRET \
        OIDC_REDIRECT_URI=https://v-notes.desync.link/auth/callback \
        REQUIRED_SCOPE=v-note:prod:access \
        OIDC_END_SESSION_URL=https://auth.desync.link/application/o/v-note-prod/end-session/ \
        OIDC_ANDROID_CLIENT_ID=v-note-android-prod \
        OIDC_ANDROID_ISSUER_URL=https://auth.desync.link/application/o/v-note-android-prod/ \
        docker compose -p v-note -f deploy/docker-compose.yml up -d

  tag-release:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    depends_on:
      - deploy-prod
    pull: true
    image: *version-plugin
    settings:
      mode: push-tag
      major_minor_source: cargo
      github_token:
        from_secret: github_token
