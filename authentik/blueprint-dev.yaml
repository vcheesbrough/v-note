# **dev only.** The rule (#274): **one file per environment, one `instance_name`
# per file** — `authentik/blueprint-<env>.yaml` applied by that environment's
# own pipeline step. Two files sharing an instance name would each overwrite the
# other's stored content on every apply, and a single file covering several
# environments is worse still: the previous combined file meant a manual deploy
# of one environment from a feature branch rewrote another's OIDC provider.
# Entries here delete live credentials, so the blast radius is kept equal to the
# environment being deployed.
#
# Dev is currently the only environment (#392). A future `blueprint-prod.yaml`
# (#388) is a new file with its own `instance_name`, and by that rule it cannot
# reach anything declared here.
version: 1
metadata:
  name: v-note OIDC (dev)
  labels:
    blueprints.goauthentik.io/description: "v-note OAuth2 provider and access scope — dev"

entries:
  - model: authentik_core.group
    state: present
    identifiers:
      name: v-note-dev-users
    attrs:
      name: v-note-dev-users

  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: "v-note:dev:access"
    attrs:
      name: "v-note:dev:access"
      scope_name: "v-note:dev:access"
      description: "Grants access to v-note dev"
      expression: |
        return {}

  # The scope the client-telemetry ingest requires on every export (#439,
  # `otlp-collector-oidc`'s REQUIRED_SCOPE). It adds no claim: being granted it
  # is the permission. Named exactly as the image's own blueprint
  # (docs/providers/authentik/otlp-collector-oidc.yaml upstream) names it, so the
  # estate has one `telemetry:write` mapping however many products attach it —
  # which also means it is not v-note's alone to delete.
  #
  # Per user or group? No: an authentik scope mapping is granted to every token
  # the provider mints for a client that asks for it — its expression can add
  # claims but cannot withhold the scope — so this scope says "this client may
  # send telemetry", which the audience already says. A per-user telemetry
  # opt-out is therefore not available from the provider; the lever that exists
  # is membership of the application's group, which gates sign-in as a whole
  # (recorded on #439).
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: "otlp-collector-oidc: telemetry:write"
    attrs:
      name: "otlp-collector-oidc: telemetry:write"
      scope_name: telemetry:write
      description: Send telemetry
      expression: |
        return {}

  # One **public** provider serves both the SPA and the Android app (#274). Both
  # run Authorization Code + PKCE, so neither holds a secret — a native app cannot
  # keep one, and the server-side browser exchange is bound by the PKCE verifier
  # instead. Carrying both redirect URIs is what gives every token a single `aud`
  # and `iss`, which let the server drop its dual-audience logic.
  #
  # The issuer derives from the **application slug**, so keeping the slug
  # `v-note-dev` leaves the browser issuer unchanged and moves only Android.
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: v-note-dev
    attrs:
      name: v-note-dev
      client_id: v-note-dev
      client_type: public
      # Must be declared explicitly. A blueprint-created provider defaults to an
      # empty grant list, which makes Authentik reject every authorize request
      # with `invalid_request` ("the request is otherwise malformed") — the login
      # outage in #372. `refresh_token` is required because the Android client
      # requests `offline_access` and refreshes (auth/AuthRepository.kt).
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - url: "https://v-notes-dev.desync.link/auth/callback"
          matching_mode: strict
        - url: "https://v-notes-dev.desync.link/auth/mobile/callback"
          matching_mode: strict
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "v-note:dev:access"]]
        # #439: the ingest refuses a token without it. `profile` above is what
        # puts `preferred_username` in the access token, which the ingest also
        # requires — removing it would stop all client telemetry.
        - !Find [authentik_providers_oauth2.scopemapping, [name, "otlp-collector-oidc: telemetry:write"]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: v-note-dev
    attrs:
      name: v-note (dev)
      slug: v-note-dev
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, v-note-dev]]

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !Find [authentik_core.application, [slug, v-note-dev]]
      group: !Find [authentik_core.group, [name, v-note-dev-users]]
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30
      target: !Find [authentik_core.application, [slug, v-note-dev]]
      group: !Find [authentik_core.group, [name, v-note-dev-users]]

  # -------------------------------------------------------------------------
  # Live post-deploy smoke user (#179). The account smoke-web-live-* in
  # .woodpecker/deploy.yml signs in as, through the real login flow, after every
  # dev deploy. Declared here rather than made by hand so it is re-asserted on
  # every apply: nobody can quietly widen it and have that survive the next push.
  #
  # Least privilege, and each property is load-bearing:
  #   - `external`: no access to the authentik user or admin interfaces, only
  #     to applications its groups allow;
  #   - `groups` is set wholesale to v-note-dev-users ONLY — never
  #     v-note-dev-admins (the SQL console) or anything outside v-note;
  #   - its pages are disposable: the smoke deletes what it creates and sweeps
  #     `live-smoke-*` leftovers, and no human uses this account.
  # `email` is what the smoke asserts /api/me returns, so it must match
  # V_NOTE_SMOKE_EMAIL in deploy.yml (scripts/test-authentik-blueprints.sh
  # checks both names match). `.invalid` so no mail can ever be delivered.
  #
  # The password is the Woodpecker secret v_note_dev_smoke_password (a broker
  # leaf in sovereign-config, docs/DEPLOY.md → Secrets), substituted by the
  # plugin's `vars` at apply time — this file holds only the placeholder.
  # Rotate it by rewriting the leaf and pushing: the next apply sets it.
  # -------------------------------------------------------------------------
  - model: authentik_core.user
    state: present
    identifiers:
      username: v-note-smoke-dev
    attrs:
      username: v-note-smoke-dev
      name: v-note live smoke (dev)
      email: v-note-smoke-dev@smoke.invalid
      type: external
      path: v-note/smoke
      is_active: true
      attributes:
        v-note/smoke-user: true
      groups:
        - !Find [authentik_core.group, [name, v-note-dev-users]]
      password: "${V_NOTE_DEV_SMOKE_PASSWORD}"

  # -------------------------------------------------------------------------
  # SQL console (#299) — a *separate* application with its own provider and its
  # own group, so that "can use v-note" and "can read every row of everyone's
  # notes" stay different facts. Nothing above is affected.
  #
  # Note #214 §3's "admins must be in both groups" does NOT apply here: that
  # described an admin surface inside the v-note application, where the
  # v-note-dev-users binding was evaluated first. This is its own application
  # with its own binding, so membership of v-note-dev-admins alone is enough.
  # -------------------------------------------------------------------------

  - model: authentik_core.group
    state: present
    identifiers:
      name: v-note-dev-admins
    attrs:
      name: v-note-dev-admins

  # The first proxy provider declared by a blueprint in either repo — every one
  # of the eleven live ones was made by hand in the UI. If this entry does not
  # apply cleanly, that is why.
  #
  # `external_host` is the bare host, NOT the /dbconsole URL. Probed on #299:
  # authentik discards any path when it builds the callback URI and emits
  # `https://<host>/outpost.goauthentik.io/callback` regardless, so writing the
  # path here would only mislead the next reader. What makes the path scoping
  # work is the pair of Traefik routers in deploy/docker-compose.yml — one for
  # /dbconsole and one for that callback.
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: v-note-sql-console-dev
    attrs:
      name: v-note-sql-console-dev
      external_host: "https://v-notes-dev.desync.link"
      mode: forward_single
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: v-note-sql-console-dev
    attrs:
      name: v-note SQL console (dev)
      slug: v-note-sql-console-dev
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, v-note-sql-console-dev]]

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !Find [authentik_core.application, [slug, v-note-sql-console-dev]]
      group: !Find [authentik_core.group, [name, v-note-dev-admins]]
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30
      target: !Find [authentik_core.application, [slug, v-note-sql-console-dev]]
      group: !Find [authentik_core.group, [name, v-note-dev-admins]]

  # 🚫 There is deliberately NO `authentik_outposts.outpost` entry here, and
  # adding one would be a LAN-wide outage waiting to happen.
  #
  # A proxy provider does nothing until it is attached to the shared "authentik
  # Embedded Outpost", whose `providers` list also holds the eleven providers
  # that protect glances, woodpecker, the Traefik dashboard and the rest. A
  # blueprint sets a list wholesale, so declaring that object here would drop
  # every one of them — and this file is applied on *every branch push*
  # (.woodpecker/deploy.yml), not just master.
  #
  # The attachment is an append-only read-modify-write instead, done by the
  # attach-sqltool-outpost step in .woodpecker/deploy.yml.

  # -------------------------------------------------------------------------
  # Retired by #274: the separate Android application and the old confidential
  # browser provider. Ordered after the entries above so the application is
  # already repointed at the unified provider before these are deleted.
  #
  # Blueprint identity is `name`/`slug`, so the browser provider is *renamed*
  # (v-note-browser-dev → v-note-dev) rather than edited in place; without
  # this the old confidential object would survive as an orphan, still holding a
  # usable client secret.
  # -------------------------------------------------------------------------

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: v-note-android-dev

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: v-note-android-dev

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: v-note-browser-dev
