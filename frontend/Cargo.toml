[package]
name = "frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
console_error_panic_hook = "0.1"
futures-util = "0.3"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
leptos = { version = "0.7", features = ["csr"] }
protocol = { path = "../crates/protocol" }
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CanvasPattern", "CanvasRenderingContext2d", "Document", "DomRect", "ImageData", "Element", "Event", "HtmlCanvasElement", "Location", "Performance", "PointerEvent", "WheelEvent", "Window"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
