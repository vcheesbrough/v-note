# Local temporary dev overlay — bypass Traefik, publish HTTPS on localhost, mock OIDC for sign-in.
# Usage: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up --build

services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10@sha256:65d4ed47ce094cc3849e41e03499bfb32372d69c726ec22b3d5a19eba9bc787e
    ports:
      - "${MOCK_OIDC_PORT:-18080}:8080"
    environment:
      SERVER_PORT: 8080
      LOG_LEVEL: INFO
      JSON_CONFIG_PATH: /config/mock-oidc.local.json
    volumes:
      - ./mock-oidc.local.json:/config/mock-oidc.local.json:ro
    networks:
      - v-note-net

  v-note:
    container_name: ${V_NOTE_CONTAINER_NAME:-v-note-local}
    ports:
      - "${V_NOTE_PORT:-8443}:443"
      - "${V_NOTE_METRICS_PORT:-9090}:9090"
    networks: !override
      - v-note-net
    labels: !override
      - traefik.enable=false
    depends_on:
      mock-oidc:
        condition: service_started

volumes:
  v-note-db:
    name: ${DB_VOLUME:-v-note-local-db}
    external: false
