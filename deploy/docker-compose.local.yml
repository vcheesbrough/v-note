# Local temporary dev overlay — bypass Traefik, publish HTTPS on localhost, mock OIDC for sign-in.
# Usage: `just run-compose` (builds the web image first — neither compose file has a
# `build:` block), or `docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up`

services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10@sha256:65d4ed47ce094cc3849e41e03499bfb32372d69c726ec22b3d5a19eba9bc787e
    ports:
      - "${MOCK_OIDC_PORT:-18080}:8080"
    environment:
      SERVER_PORT: 8080
      LOG_LEVEL: INFO
      JSON_CONFIG_PATH: /config/mock-oidc.local.json
    volumes:
      - ./mock-oidc.local.json:/config/mock-oidc.local.json:ro
    networks:
      - v-note-net

  v-note:
    container_name: ${V_NOTE_CONTAINER_NAME:-v-note-local}
    ports:
      - "${V_NOTE_PORT:-8443}:443"
      - "${V_NOTE_METRICS_PORT:-9090}:9090"
    networks: !override
      - v-note-net
    labels: !override
      - traefik.enable=false
    # No sovereign-config server locally: blank the access URL so that layer is
    # skipped, and supply every group from the plain VNOTE__* env layer instead.
    # Multi-word leaf segments are kebab-case to match sovereign-config paths.
    secrets: !override []
    environment:
      SOVEREIGN_CONFIG_ACCESS_URL_FILE: ""
      VNOTE__DATABASE__HOST: postgres
      VNOTE__DATABASE__PORT: "5432"
      VNOTE__DATABASE__NAME: v_note
      VNOTE__DATABASE__USER: v_note
      VNOTE__DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (deploy/.env locally)}
      VNOTE__OIDC__ISSUER-URL: ${OIDC_ISSUER_URL:?Set OIDC_ISSUER_URL (deploy/compose.env)}
      VNOTE__OIDC__AUTHORIZE-URL: ${OIDC_AUTHORIZE_URL:-}
      VNOTE__OIDC__CLIENT-ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID (deploy/compose.env)}
      VNOTE__OIDC__REDIRECT-URI: ${OIDC_REDIRECT_URI:?Set OIDC_REDIRECT_URI (deploy/compose.env)}
      VNOTE__OIDC__REQUIRED-SCOPE: ${REQUIRED_SCOPE:?Set REQUIRED_SCOPE (deploy/compose.env)}
      # Unset by default — mock OIDC has no end-session endpoint — but forwarded so
      # pointing local compose at real Authentik gets RP-initiated logout.
      VNOTE__OIDC__END-SESSION-URL: ${OIDC_END_SESSION_URL:-}
      VNOTE__OBSERVABILITY__ENVIRONMENT: ${APP_ENV:-dev}
      # Unset by default (no local collector), but forwarded so a developer can
      # export traces without editing this file. Keeps the pre-migration variable
      # name so anything already exporting it keeps working; blank means "absent",
      # which correctly leaves trace export disabled.
      VNOTE__OBSERVABILITY__OTLP-ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      VNOTE__ANDROID__ASSETLINKS-JSON: ${ASSETLINKS_JSON:-}
      # Client telemetry (#439): unset, clients are told nothing and send
      # nothing. See the otlp-collector-oidc service below.
      VNOTE__CLIENT-TELEMETRY__ENDPOINT: ${CLIENT_TELEMETRY_ENDPOINT:-}
      # The old ingress (#354), removed with the sidecar at the end of #439.
      VNOTE__CLIENT-TELEMETRY__ENABLED: ${CLIENT_TELEMETRY_ENABLED:-false}
      VNOTE__CLIENT-TELEMETRY__SPA-ENDPOINT: http://${V_NOTE_CONTAINER_NAME:-v-note-local}-alloy:4318
      VNOTE__CLIENT-TELEMETRY__ANDROID-ENDPOINT: http://${V_NOTE_CONTAINER_NAME:-v-note-local}-alloy:4319
    depends_on:
      mock-oidc:
        condition: service_started

  # Local has no proxy-backend (it is mini's shared Traefik network) and no
  # monitoring stack, so the sidecar joins only the app's network. Its exporters
  # keep their deployed defaults and so fail to resolve — Alloy logs that and
  # drops the data, which is the right behaviour for "no backend here". Point
  # CLIENT_TELEMETRY_TEMPO_ENDPOINT / CLIENT_TELEMETRY_LOKI_ENDPOINT at your own
  # to see the output.
  v-note-alloy:
    container_name: ${V_NOTE_CONTAINER_NAME:-v-note-local}-alloy
    networks: !override
      - v-note-net
    labels: !override
      - traefik.enable=false

  # The client telemetry ingest (#439), reached directly on :4318 — there is no
  # Traefik here to route `/v1/` on the app's host to it, so the SPA's export is
  # cross-origin locally (CORS below) where it is same-origin when deployed.
  # Off for clients unless asked for: `CLIENT_TELEMETRY_ENDPOINT=https://localhost:4318
  # just run-compose` makes the app hand that endpoint out (accept the ingest's
  # self-signed certificate in the browser once by opening it). With no
  # monitoring stack locally its exports fail and are dropped, which is the
  # right behaviour for "no backend here"; point OTEL_EXPORTER_OTLP_ENDPOINT at
  # your own collector to see the output.
  otlp-collector-oidc:
    container_name: ${V_NOTE_CONTAINER_NAME:-v-note-local}-otlp-collector-oidc
    ports:
      - "${OTLP_INGEST_PORT:-4318}:4318"
    environment:
      OIDC_AUDIENCE: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID (deploy/compose.env)}
      OIDC_DISCOVERY_RETRY: 5s
      CORS_ALLOWED_ORIGINS: https://localhost:${V_NOTE_PORT:-8443}
      LOG_OUTPUT: stdout
    networks: !override
      - v-note-net
    labels: !override
      - traefik.enable=false

volumes:
  v-note-db:
    name: ${DB_VOLUME:-v-note-local-db}
    external: false
