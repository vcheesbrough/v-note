# Deploy workflow.
#   Push:       after checks, web and android all pass → verify-release-images →
#               apply-authentik-blueprint-auto-dev → auto-deploy-dev → tag-release-auto-dev
#               ∥ publish-grafana-dashboard
#   Deployment: validate-deployment ∥ compute-version → apply-authentik-blueprint-<target>
#               → deploy-dev | deploy-prod → tag-release-*
# The push path runs on `master` only: it applies a blueprint and deploys dev,
# both shared infrastructure (#274). Blueprints are split per environment so no
# step can reach another environment's Authentik objects.
# See checks.yml for why the push pipeline is split into workflows.

when:
  - event: [push, deployment]

# `optional` because a deployment event builds nothing: checks, web and android
# only run on push/manual, and a non-optional dependency on a workflow that is not
# part of the pipeline would stop manual deploys. On push all three are present,
# so they are enforced — this workflow runs only if every one of them succeeded.
depends_on:
  - name: checks
    optional: true
  - name: web
    optional: true
  - name: android
    optional: true

steps:
  compute-version:
    depends_on: []
    pull: true
    image: &version-plugin ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.1.1@sha256:cf74d9706cb42b6d27c8d185789cd814ed061c8c88e06452d33ce3aed0bf9a22
    settings:
      mode: compute
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  validate-deployment:
    when:
      - event: deployment
    depends_on: []
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    commands:
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" != "dev" ] && [ "$$CI_PIPELINE_DEPLOY_TARGET" != "prod" ]; then
          echo "ERROR: deploy target must be 'dev' or 'prod' (got: '$$CI_PIPELINE_DEPLOY_TARGET')"
          exit 1
        fi
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" = "prod" ] && [ "$$CI_COMMIT_BRANCH" != "master" ]; then
          echo "ERROR: prod can only be deployed from master (current branch: '$$CI_COMMIT_BRANCH')"
          exit 1
        fi

  # This workflow computed its release tag itself — workflows share nothing. It
  # matches the tag web and android built with unless another pipeline pushed a tag
  # on this line in between, and then it would name *another commit's* images.
  # Refuse to roll out anything whose revision label is not this commit.
  verify-release-images:
    when:
      - event: push
    depends_on:
      - compute-version
    image: &docker-image docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes: &docker-socket
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - |
        RELEASE_TAG=$$(cat .release-tag)
        for REPO in registry.desync.link/v-note registry.desync.link/v-note-android; do
          docker pull --quiet "$$REPO:$$RELEASE_TAG"
          ./scripts/check-image-metadata.sh "$$REPO:$$RELEASE_TAG" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
        done

  # One step per target, each applying only that environment's blueprint (#274).
  # A single step applying a dev+prod file meant a manual **dev** deployment from
  # a feature branch rewrote **prod**'s OIDC provider — `validate-deployment` only
  # restricts the prod *target* to master, not the blueprint's reach.
  apply-authentik-blueprint-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - validate-deployment
    pull: true
    image: &authentik-plugin ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0@sha256:9f262c4390205b5629e9af7560f4e492f0155395a429153703ba351206d9d975
    settings: &authentik-dev-settings
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint-dev.yaml
      # Per-file instance names: two files sharing one instance would each
      # overwrite the other's stored content on every apply.
      instance_name: v-note-dev
      timeout_seconds: 900
      # No `vars`: #274 made the provider public (PKCE), so the blueprint no
      # longer interpolates a client secret.

  apply-authentik-blueprint-prod:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    depends_on:
      - validate-deployment
    pull: true
    image: *authentik-plugin
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint-prod.yaml
      instance_name: v-note-prod
      timeout_seconds: 900

  # The push gates (checks, web, android) are enforced by the workflow-level
  # depends_on above, not by step dependencies.
  # `branch: master` is a blast-radius guard, not a convenience — and it is still
  # needed now that this applies only `blueprint-dev.yaml`. The per-env split stops
  # a dev apply reaching *prod*; this stops an *unreviewed* branch redefining dev's
  # own provider on the shared Authentik, which would break dev login for everyone
  # until the branch was fixed or reverted. #274 proved both halves: that branch
  # push deleted the live providers for both environments before review, and left
  # dev unable to authenticate.
  apply-authentik-blueprint-auto-dev:
    when:
      - event: push
        branch: master
    depends_on:
      - verify-release-images
    pull: true
    image: *authentik-plugin
    settings: *authentik-dev-settings

  deploy-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - validate-deployment
      - compute-version
      - apply-authentik-blueprint-dev
    image: *docker-image
    volumes: *docker-socket
    # The whole dev environment, defined once and reused by auto-deploy-dev.
    # deploy-v-note.sh takes no arguments and knows nothing about dev vs prod —
    # every environment-specific value is right here.
    environment: &deploy-dev-environment
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      POSTGRES_PASSWORD:
        from_secret: v_note_dev_postgres_password
      # Unlocks the /v-note/dev/server sovereign-config subtree; the URL
      # itself selects the environment.
      SOVEREIGN_CONFIG_ACCESS_URL_FILE:
        from_secret: v_note_dev_sovereign_access_url
      # Alias of /v-note/dev/server/observability/metrics-addr — the same stored
      # value the app reads, exposed to the broker so the deploy can derive the
      # Alloy scrape labels docker writes at container-create time. A plain
      # value, not a secret; `from_secret` is Woodpecker's only broker channel.
      V_NOTE_METRICS_ADDR:
        from_secret: v_note_dev_metrics_addr
      # Read by `docker compose` itself, so the script needs no -p/-f flags.
      COMPOSE_PROJECT_NAME: v-note-dev
      COMPOSE_FILE: deploy/docker-compose.yml:deploy/docker-compose.android-apk.yml
      V_NOTE_IMAGE_REPOS: registry.desync.link/v-note registry.desync.link/v-note-android
      V_NOTE_HOST: v-notes-dev.desync.link
      V_NOTE_CONTAINER_NAME: v-note-dev
      DB_VOLUME: v-note-dev-db
      # Canonical environment name, matching the sovereign-config
      # `observability/environment` leaf the server uses for the OTEL
      # `deployment.environment` trace attribute. Deliberately not the branch
      # name: that split one deployment across two values, so traces said `dev`
      # while the metrics/log discovery labels said e.g. `feat/foo` and no single
      # environment filter matched all three signals. The build is already
      # identified by `observability.release` and the image's
      # `org.opencontainers.image.revision`.
      APP_ENV: dev
    commands: &deploy-commands
      - ./scripts/deploy-v-note.sh

  # Also `branch: master`: dev and the blueprint have to move together, and the
  # blueprint is master-only above. A branch build deployed to dev against a
  # master-era Authentik would fail exactly the way #274 did.
  auto-deploy-dev:
    when:
      - event: push
        branch: master
    depends_on:
      - compute-version
      - apply-authentik-blueprint-auto-dev
    image: *docker-image
    volumes: *docker-socket
    environment: *deploy-dev-environment
    commands: *deploy-commands

  # The gate #372 was missing. Everything upstream of this step passed while login
  # was down in both environments: the blueprint applied, the app was healthy, and
  # e2e was green against a mock IdP with no client registry. This is the only
  # step that asks the *real* Authentik whether it will accept our authorize
  # request. It runs after the deploy so it exercises the provider and the app
  # that were just published together.
  #
  # curl is deliberately unpinned, as in publish-grafana-dashboard: the base image
  # is digest-pinned, and Alpine drops superseded versions from a stable branch.
  smoke-oidc-login-auto-dev:
    when:
      - event: push
        branch: master
    depends_on:
      - auto-deploy-dev
    image: &smoke-image alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    environment: &smoke-dev-environment
      V_NOTE_HOST: v-notes-dev.desync.link
    commands: &smoke-commands
      - apk add --no-cache curl bash
      - ./scripts/smoke-oidc-login.sh

  smoke-oidc-login-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - deploy-dev
    image: *smoke-image
    environment: *smoke-dev-environment
    commands: *smoke-commands

  smoke-oidc-login-prod:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    depends_on:
      - deploy-prod
    image: *smoke-image
    environment:
      V_NOTE_HOST: v-notes.desync.link
    commands: *smoke-commands

  # `branch: master` follows auto-deploy-dev: Woodpecker prunes steps whose
  # `when` does not match, so a dependent left on plain `event: push` would
  # reference a step that no longer exists on a feature branch and fail the
  # whole config as invalid.
  tag-release-auto-dev:
    when:
      - event: push
        branch: master
    depends_on:
      - auto-deploy-dev
    pull: true
    image: *version-plugin
    settings:
      mode: push-tag
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  # Publishes deploy/grafana/v-note-overview.json to Grafana (Applications / v-note)
  # over the HTTP API — the dashboard counterpart of apply-authentik-blueprint.
  # Every push to master, right after auto-deploy-dev: the dashboard tracks
  # whatever is deployed to dev. It was previously published from any branch, but
  # dev itself is now master-only (#274 — a branch push must not touch shared
  # infrastructure), so a branch's dashboard would chart metrics from a build that
  # was never deployed. The last push wins, and the version message names the
  # branch. Never from deploy-prod, which
  # could roll the dashboard back to an older release. It does not gate
  # tag-release-auto-dev. grafana_api_token is the shared woodpecker-ci
  # service-account token (/woodpecker/shared, Edit on the Applications folder).
  # curl/jq are deliberately unpinned: the base image is digest-pinned, and Alpine
  # removes superseded versions from a stable branch's repo, so `pkg=<ver>` would
  # break this step on the next security update instead of picking it up.
  publish-grafana-dashboard:
    when:
      - event: push
        branch: master
    depends_on:
      - auto-deploy-dev
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    environment:
      GRAFANA_URL: https://grafana.desync.link
      GRAFANA_FOLDER_UID: v-note
      GRAFANA_TOKEN:
        from_secret: grafana_api_token
    commands:
      - apk add --no-cache curl jq
      - GRAFANA_MESSAGE_PREFIX="v-note $$CI_COMMIT_BRANCH" RELEASE_TAG="$$(cat .release-tag)" COMMIT_SHA="$$CI_COMMIT_SHA" ./scripts/publish-grafana-dashboard.sh deploy/grafana/v-note-overview.json

  deploy-prod:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    depends_on:
      - validate-deployment
      - compute-version
      - apply-authentik-blueprint-prod
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      POSTGRES_PASSWORD:
        from_secret: v_note_prod_postgres_password
      # Unlocks the /v-note/prod/server sovereign-config subtree.
      SOVEREIGN_CONFIG_ACCESS_URL_FILE:
        from_secret: v_note_prod_sovereign_access_url
      # Alias of /v-note/prod/server/observability/metrics-addr — see deploy-dev.
      V_NOTE_METRICS_ADDR:
        from_secret: v_note_prod_metrics_addr
      # No android-apk overlay on prod: the APK delivery image is dev-only.
      COMPOSE_PROJECT_NAME: v-note
      COMPOSE_FILE: deploy/docker-compose.yml
      V_NOTE_IMAGE_REPOS: registry.desync.link/v-note
      V_NOTE_HOST: v-notes.desync.link
      V_NOTE_CONTAINER_NAME: v-note
      DB_VOLUME: v-note-prod-db
      APP_ENV: production
    commands: *deploy-commands

  tag-release-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - deploy-dev
    pull: true
    image: *version-plugin
    settings: &push-tag-settings
      mode: push-tag
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  tag-release-prod:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    depends_on:
      - deploy-prod
    pull: true
    image: *version-plugin
    settings: *push-tag-settings
