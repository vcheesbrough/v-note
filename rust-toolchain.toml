# Host-dev toolchain pin. Keep the channel byte-identical with the `rust:<ver>`
# images in `Dockerfile.web` (builder `FROM`) and `Dockerfile.rust-ci` (CI lint and
# tests) — all three move together on a toolchain bump.
#
# Kept out of CI because the images there already *are* this toolchain and
# re-resolving it would only download the components below. Every Rust build in CI
# is a `docker build`, and each Dockerfile's paired `.dockerignore` excludes this
# file. `Dockerfile.rust-ci` then adds clippy and rustfmt explicitly for `lint`:
# the `rust:` images ship a minimal profile without them.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
