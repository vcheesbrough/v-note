services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_DB: v_note
      POSTGRES_USER: v_note
      POSTGRES_PASSWORD: test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v_note -d v_note"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks:
      - e2e-net

  # Mock OIDC — wired for #146 auth e2e; tests skip auth setup when OIDC_TOKEN_URL is unset.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10@sha256:65d4ed47ce094cc3849e41e03499bfb32372d69c726ec22b3d5a19eba9bc787e
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "client_id",
                  "match": "v-note-test",
                  "claims": {
                    "sub": "v-note-test-service-account",
                    "aud": ["v-note-test"],
                    "scope": "openid profile email v-note:test:access",
                    "preferred_username": "test-user",
                    "email": "test@example.com"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-android-test",
                  "claims": {
                    "sub": "v-note-android-test-user",
                    "aud": ["v-note-android-test"],
                    "scope": "openid profile email v-note:test:access",
                    "preferred_username": "android-test-user",
                    "email": "android@example.com"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "v-note-test-wrong",
                  "claims": {
                    "sub": "wrong-scope-user",
                    "aud": ["v-note-test"],
                    "scope": "openid profile email v-note:wrong:access",
                    "preferred_username": "wrong-scope-user",
                    "email": "wrong@example.com"
                  }
                }
              ]
            }
          ]
        }
    networks:
      - e2e-net

  app:
    image: ${TEST_IMAGE:?TEST_IMAGE must be set}
    environment:
      APP_ENV: test
      APP_VERSION: test
      OIDC_ISSUER_URL: http://mock-oidc:8080/default
      OIDC_CLIENT_ID: v-note-test
      OIDC_CLIENT_SECRET: test-secret
      OIDC_REDIRECT_URI: https://app:443/auth/callback
      REQUIRED_SCOPE: v-note:test:access
      OIDC_ANDROID_CLIENT_ID: v-note-android-test
      OIDC_ANDROID_ISSUER_URL: http://mock-oidc:8080/default
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: v_note
      DATABASE_PASSWORD: test-password
      DATABASE_NAME: v_note
    depends_on:
      mock-oidc:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - e2e-net

  legacy-migration-fixture:
    image: v-note-e2e-legacy-migration-fixture:${OCI_IMAGE_VERSION:-local}
    build:
      context: .
      additional_contexts:
        server-migrations: ../crates/server/migrations
      dockerfile_inline: |
        FROM postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        COPY fixtures/legacy-stroke.sql /fixtures/legacy-stroke.sql
        COPY --from=server-migrations 20260716003000_backfill_legacy_strokes.sql /migrations/20260716003000_backfill_legacy_strokes.sql
    environment:
      PGPASSWORD: test-password
    command:
      - sh
      - -ec
      - |
        until psql -h postgres -U v_note -d v_note -tAc "SELECT to_regclass('public.stroke_batches') IS NOT NULL" | grep -q t; do sleep 1; done
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note -f /fixtures/legacy-stroke.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note -f /migrations/20260716003000_backfill_legacy_strokes.sql
        first_id="$$(psql -h postgres -U v_note -d v_note -tAc "SELECT strokes->0->>'id' FROM stroke_batches WHERE page_id = 'page_legacy_v2'")"
        psql -v ON_ERROR_STOP=1 -h postgres -U v_note -d v_note -f /migrations/20260716003000_backfill_legacy_strokes.sql
        second_id="$$(psql -h postgres -U v_note -d v_note -tAc "SELECT strokes->0->>'id' FROM stroke_batches WHERE page_id = 'page_legacy_v2'")"
        test -n "$$first_id" && test "$$first_id" = "$$second_id"
        touch /tmp/fixture-ready
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/fixture-ready"]
      interval: 1s
      timeout: 2s
      retries: 20
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - e2e-net

  playwright:
    image: v-note-e2e-playwright:${OCI_IMAGE_VERSION:-local}
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.54.2-jammy@sha256:948dc1e8601eeb152b31ef57959a74c2170be6fe875c33518bf33aea424d8940
        WORKDIR /e2e
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        CMD ["npx", "playwright", "test"]
      labels:
        org.opencontainers.image.title: v-note-e2e-playwright
        org.opencontainers.image.description: v-note Playwright e2e test runner image
        org.opencontainers.image.licenses: PolyForm-Noncommercial-1.0.0
        org.opencontainers.image.url: https://github.com/vcheesbrough/v-note
        org.opencontainers.image.authors: Vincent Cheesbrough
        org.opencontainers.image.vendor: Vincent Cheesbrough
        org.opencontainers.image.documentation: https://github.com/vcheesbrough/v-note/blob/master/docs/DEPLOY.md
        org.opencontainers.image.base.name: mcr.microsoft.com/playwright:v1.54.2-jammy
        org.opencontainers.image.base.digest: sha256:948dc1e8601eeb152b31ef57959a74c2170be6fe875c33518bf33aea424d8940
        org.opencontainers.image.version: ${OCI_IMAGE_VERSION:-local}
        org.opencontainers.image.revision: ${OCI_IMAGE_REVISION:-dev}
        org.opencontainers.image.source: https://github.com/vcheesbrough/v-note
        org.opencontainers.image.created: ${OCI_IMAGE_CREATED:-unknown}
    environment:
      BASE_URL: https://app:443
      OIDC_TOKEN_URL: http://mock-oidc:8080/default/token
      OIDC_CLIENT_ID: v-note-test
      OIDC_CLIENT_SECRET: test-secret
      REQUIRED_SCOPE: v-note:test:access
    volumes:
      - ${REPORT_DIR:-./playwright-report}:/e2e/playwright-report
    depends_on:
      app:
        condition: service_started
      mock-oidc:
        condition: service_started
      legacy-migration-fixture:
        condition: service_healthy
    networks:
      - e2e-net

networks:
  e2e-net:
