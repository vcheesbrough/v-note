# Web workflow: build the release image, then run Playwright e2e against it.
# See checks.yml for why the push pipeline is split into workflows.

when:
  - event: [push, manual]

steps:
  # Workflows share nothing, so each computes its own release tag:
  # scripts/release-version.sh reuses the tag already on this commit, or takes
  # Cargo.toml's major.minor with the pipeline number as the patch. Every workflow
  # of one pipeline sees the same number, so they agree, and no two pipelines can
  # compute the same tag (#462). deploy.yml still verifies the images' revision
  # label before it tags or rolls anything out.
  compute-version:
    depends_on: []
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      # git is unpinned for the reason given on the apk lines in deploy.yml: the
      # base image is digest-pinned, and Alpine drops superseded versions.
      - apk add --no-cache git
      - ./scripts/release-version.sh compute

  build-web:
    depends_on:
      - compute-version
    image: &docker-image docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes: &docker-socket
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      # Needed by the cargo layers to fetch the private sovereign-config git dep.
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/v-note:$$RELEASE_TAG
        START=$$(date +%s)
        docker build -f Dockerfile.web \
          --secret id=github_token,env=GITHUB_TOKEN \
          --build-arg V_NOTE_RELEASE="$$RELEASE_TAG" \
          --build-arg OCI_IMAGE_VERSION="$$RELEASE_TAG" \
          --build-arg OCI_IMAGE_REVISION="$$CI_COMMIT_SHA" \
          --build-arg OCI_IMAGE_CREATED="$$(git -c safe.directory='*' log -1 --format=%cI)" \
          -t "$$IMAGE" .
        echo "timing: docker build Dockerfile.web took $$(( $$(date +%s) - $$START ))s"
        # The image that actually ships, gated on the same label contract the e2e
        # support image is held to — this is the check that caught the missing
        # authors/vendor labels the old --label flags never set.
        ./scripts/check-image-metadata.sh "$$IMAGE" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
        # Both gated before the push: the deploy step and the e2e stack below now
        # wait on this image's own healthcheck, so an image whose probe is broken
        # would not fail loudly — it would hang until a timeout.
        ./scripts/test-container-health.sh "$$IMAGE"
        START=$$(date +%s)
        docker push "$$IMAGE"
        echo "timing: docker push $$IMAGE took $$(( $$(date +%s) - $$START ))s"

  # Skips — support image build and stack alike — when the web lane key has
  # already passed (#467, scripts/lane-key.sh): nothing the image or the suite
  # reads changed since a green run. build-web above always runs, so the image
  # that ships still carries this pipeline's release tag and passed its own
  # metadata and health gates. FULL_RUN=1 on a manual pipeline runs it anyway.
  e2e-web:
    depends_on:
      - build-web
    image: *docker-image
    volumes: *docker-socket
    environment:
      # Reads and writes the lane-key markers (refs/ci/green/…).
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        if ./scripts/lane-key.sh skip e2e-web; then exit 0; fi
      - |
        RELEASE_TAG=$$(cat .release-tag)
        # One compose project per pipeline. The default (the directory, `e2e`)
        # is shared by every pipeline on the agent, so two branches' e2e runs
        # recreated and removed each other's containers mid-test (#417,
        # pipeline 422). Exported rather than `-p` so the file can interpolate
        # it: monitor-alloy narrows its Docker scrape to this project.
        export COMPOSE_PROJECT_NAME="v-note-e2e-$$CI_PIPELINE_NUMBER"
        export OCI_IMAGE_VERSION="$$RELEASE_TAG"
        export OCI_IMAGE_REVISION="$$CI_COMMIT_SHA"
        export OCI_IMAGE_CREATED="$$(git -c safe.directory='*' log -1 --format=%cI)"
        REPORT=/srv/dev/playwright-reports/v-note-$$CI_PIPELINE_NUMBER--$(echo $$CI_COMMIT_BRANCH | tr '/' '-')--$(echo $$CI_COMMIT_SHA | cut -c1-7)
        START=$$(date +%s)
        TEST_IMAGE="registry.desync.link/v-note:$$RELEASE_TAG" docker compose -f e2e/docker-compose.test.yml -f e2e/docker-compose.android-apk.test.yml build playwright v-note-android-apk legacy-migration-fixture monitor-alloy tempo loki
        echo "timing: e2e support image build took $$(( $$(date +%s) - $$START ))s"
        ./scripts/check-image-metadata.sh "v-note-e2e-playwright:$$RELEASE_TAG" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
        START=$$(date +%s)
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/v-note:$$RELEASE_TAG docker compose -f e2e/docker-compose.test.yml -f e2e/docker-compose.android-apk.test.yml up --force-recreate --abort-on-container-exit --exit-code-from playwright && RC=0 || RC=$$?
        echo "timing: e2e compose up took $$(( $$(date +%s) - $$START ))s"
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/v-note:$$RELEASE_TAG docker compose -f e2e/docker-compose.test.yml -f e2e/docker-compose.android-apk.test.yml down --volumes
        echo "Test report: $$REPORT/index.html"
        [ "$$RC" != 0 ] || ./scripts/lane-key.sh mark e2e-web
        exit $$RC
