# Mini deploy (Woodpecker, default): Traefik on proxy-backend, LAN/VPN middleware, no host ports.
# Local temporary dev: add -f deploy/docker-compose.local.yml (published :8443, no Traefik).

services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    environment:
      POSTGRES_DB: v_note
      POSTGRES_USER: v_note
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (deploy/.env locally, OpenBao in CI)}
    volumes:
      - v-note-db:/var/lib/postgresql/data
    networks:
      - v-note-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v_note -d v_note"]
      interval: 5s
      timeout: 5s
      retries: 5

  v-note:
    image: registry.desync.link/v-note:${V_NOTE_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile.web
      # sovereign-config-provider is a git dep on a private repo, so the cargo
      # layers need a credential — the same one CI passes via --secret. Set
      # GITHUB_TOKEN before `--build`; see docs/DEV.md.
      secrets:
        - github_token
      labels:
        org.opencontainers.image.title: v-note
        org.opencontainers.image.description: v-note server (Axum API + Leptos SPA static)
        org.opencontainers.image.licenses: PolyForm-Noncommercial-1.0.0
        org.opencontainers.image.url: https://github.com/vcheesbrough/v-note
        org.opencontainers.image.authors: Vincent Cheesbrough
        org.opencontainers.image.vendor: Vincent Cheesbrough
        org.opencontainers.image.documentation: https://github.com/vcheesbrough/v-note/blob/master/docs/DEPLOY.md
        org.opencontainers.image.base.name: debian:trixie-slim
        org.opencontainers.image.base.digest: sha256:b6e2a152f22a40ff69d92cb397223c906017e1391a73c952b588e51af8883bf8
        org.opencontainers.image.version: ${OCI_IMAGE_VERSION:-local}
        org.opencontainers.image.revision: ${OCI_IMAGE_REVISION:-dev}
        org.opencontainers.image.source: https://github.com/vcheesbrough/v-note
        org.opencontainers.image.created: ${OCI_IMAGE_CREATED:-unknown}
    container_name: ${V_NOTE_CONTAINER_NAME:?V_NOTE_CONTAINER_NAME is required}
    restart: unless-stopped
    environment:
      # Runtime config (database / oidc / observability / android) comes from
      # sovereign-config, reached via the access-URL secret below. Only build,
      # orchestration and image-internal values stay here — see card #273.
      # Set to an empty value (docker-compose.local.yml) to disable the
      # sovereign-config layer and fall back to plain VNOTE__* env.
      # Points at the docker secret below; the provider reads the URL from that file.
      SOVEREIGN_CONFIG_ACCESS_URL_FILE: /run/secrets/SOVEREIGN_CONFIG_ACCESS_URL_FILE
      V_NOTE_HOST: ${V_NOTE_HOST:?V_NOTE_HOST is required}
      VNOTE_PROTOCOL_VERSION: ${VNOTE_PROTOCOL_VERSION:-2}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=${APP_ENV:-dev},service.version=${APP_VERSION:-0.11.0},vnote.protocol=${VNOTE_PROTOCOL_VERSION:-2}}
    secrets:
      - SOVEREIGN_CONFIG_ACCESS_URL_FILE
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - v-note-net
      - proxy-backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}.entrypoints=websecure
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}.rule=Host(`${V_NOTE_HOST}`)
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}.tls=true
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}.tls.certresolver=myresolver
      - traefik.http.routers.${V_NOTE_CONTAINER_NAME}.middlewares=lan-vpn-only@docker,rate-limit@docker,crowdsec@docker,security-headers@docker
      - traefik.http.services.${V_NOTE_CONTAINER_NAME}.loadbalancer.server.port=443
      - traefik.http.services.${V_NOTE_CONTAINER_NAME}.loadbalancer.server.scheme=https
      - observability.metrics.scrape=true
      - observability.metrics.port=9090
      - observability.metrics.path=/metrics
      - observability.metrics.scheme=http
      - observability.service=v-note
      - observability.env=${APP_ENV:-dev}
      - observability.release=${APP_VERSION:-0.11.0}
      - observability.protocol=${VNOTE_PROTOCOL_VERSION:-2}

secrets:
  # Sourced straight from the Woodpecker secret v_note_{dev,prod}_sovereign_access_url,
  # exposed by the deploy step as the SOVEREIGN_CONFIG_ACCESS_URL_FILE env var. Compose
  # materialises it as a file mounted at /run/secrets/SOVEREIGN_CONFIG_ACCESS_URL_FILE.
  # The connection URL is itself a secret and selects the env: dev vs prod is decided
  # by *which* URL is injected. The local overlay drops this mount and blanks the env
  # var to disable the sovereign layer entirely.
  SOVEREIGN_CONFIG_ACCESS_URL_FILE:
    environment: SOVEREIGN_CONFIG_ACCESS_URL_FILE

  # Build-time only (v-note.build.secrets), never mounted into the running
  # container: lets a local `--build` fetch the private sovereign-config git dep
  # the same way CI does. Deploys pull a prebuilt image and never reference it.
  github_token:
    environment: GITHUB_TOKEN

volumes:
  v-note-db:
    name: ${DB_VOLUME:?DB_VOLUME is required}
    external: true

networks:
  v-note-net:
    name: ${DOCKER_NETWORK:-v-note-net}
  proxy-backend:
    external: true
