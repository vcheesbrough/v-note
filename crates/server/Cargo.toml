[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Compiles the tests that need a real Postgres: `#[sqlx::test]` connects to
# `DATABASE_URL` and gives each test its own freshly migrated database. CI enables
# it through scripts/rust-ci-test.sh, which starts that database; a plain
# `cargo test` leaves them out.
postgres-tests = []

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
# 0.8's plain `tls-rustls` also enables `rustls/aws-lc-rs`. `-no-provider` builds the
# TLS config from the process-default provider instead — ring, installed in `main.rs`.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
config = { version = "0.15", default-features = false }
futures-util = "0.3"
# 10+ selects its crypto backend by feature and compiles either way, but panics at the
# first encode/decode unless exactly one of `rust_crypto`/`aws_lc_rs` is enabled.
# aws-lc is already in the build and avoids pulling the `rsa` crate.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
once_cell = "1.21.4"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = "0.32.1"
prometheus = "0.14.0"
protocol = { path = "../protocol" }
rand = "0.10"
tiny-skia = "0.12"
# 0.13 renamed `rustls-tls` to `rustls` and put `.form()` (the OIDC token exchange)
# behind `form`. It trusts the system store (platform verifier), not bundled webpki
# roots — the runtime image installs `ca-certificates` — and uses the process-default
# provider (ring, from `main.rs`) when one is installed.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
rustls = { version = "0.23", features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
# PKCE S256 challenge only (RFC 7636) — not a general crypto dependency.
sha2 = "0.11"
sovereign-config-provider = { git = "https://github.com/vcheesbrough/sovereign-config", tag = "2.19.4", features = ["config"] }
# 0.9 deleted the combined runtime+TLS features; `runtime-tokio` + `tls-rustls-ring`
# is the exact expansion of the 0.8 `runtime-tokio-rustls` this replaced (ring +
# webpki roots), so the TLS stack is unchanged.
sqlx = { version = "0.9", default-features = false, features = ["chrono", "derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring", "uuid"] }
time = "0.3"
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
yawc = { version = "0.4.2", features = ["axum"] }

[dev-dependencies]
axum-extra = { version = "0.12", features = ["cookie"] }
flate2 = "1.1.10"
# Same backend as [dependencies]: enabling a second one makes jsonwebtoken panic.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
# `testing` adds the in-memory span exporter the span-attribute tests read back.
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }
serde = { workspace = true }
tower = { version = "0.5", features = ["util"] }
