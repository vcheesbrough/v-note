# Deploy workflow.
#   Push:       after checks, web and android all pass → compute-version →
#               verify-release-images → tag-release
#   Deployment: validate-deployment ∥ compute-version → verify-release-images →
#               apply-authentik-blueprint-dev → attach-sqltool-outpost-dev →
#               deploy-dev → smoke-oidc-login-dev ∥ smoke-sql-console-dev ∥
#               smoke-web-live-dev ∥ publish-grafana-dashboard
# Dev is the only deploy target (#392); a production environment is deferred to
# #388, which re-adds the steps for it.
#
# A push never deploys (#462). It builds, tests and tags; dev — shared and
# last-deploy-wins — changes only when someone asks for it with a manual
# deployment (target `dev`) of a commit whose push pipeline went green, from any
# branch. Until #462 every push on every branch applied the blueprint and
# redeployed dev, so parallel iterations queued behind each other's deploys and
# overwrote each other's dev. The deploy steps themselves are unchanged; only the
# event that runs them is.
#
# That includes master, deliberately: a merge does not deploy either. The cost is
# that the live smokes (#372 login, #299 SQL console, #179 signed-in web) no
# longer run after every merge — only when someone deploys — and dev holds
# whatever was deployed last, possibly a branch, until someone redeploys. A merge
# that breaks real-Authentik login is green and tagged until the next deployment
# finds it. So deploy master after merging anything that touches auth, the
# blueprint, the deploy or migrations, and deploy a branch before merging it when
# that is what it changes. A master-only auto-deploy would bring back the
# duplicated push path and overwrite whichever branch is on dev at every merge.
#
# The push path still tags, and the tag is what a deployment looks for. The
# release tag is Cargo.toml's major.minor plus the pipeline number as the patch
# (scripts/release-version.sh) — unique per pipeline, so parallel builds never
# share an image tag. A deployment has a pipeline number of its own, so it finds
# the tag its commit was built under on the commit itself, and only a green push
# pipeline puts one there: a commit without one never went green, so there is
# nothing tested to deploy. A tag therefore means "built and passed checks, web
# and android" — no longer "deployed and smoke-tested on dev"; the smokes gate
# the manual deployment instead.
# See checks.yml for why the push pipeline is split into workflows.

when:
  - event: [push, deployment]

# `optional` because a deployment event builds nothing: checks, web and android
# only run on push/manual, and a non-optional dependency on a workflow that is not
# part of the pipeline would stop manual deploys. On push all three are present,
# so they are enforced — this workflow runs only if every one of them succeeded.
depends_on:
  - name: checks
    optional: true
  - name: web
    optional: true
  - name: android
    optional: true

steps:
  compute-version:
    depends_on: []
    image: &release-version-image alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    environment: &release-version-environment
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      # git is unpinned for the reason given on the apk lines in deploy.yml: the
      # base image is digest-pinned, and Alpine drops superseded versions.
      - apk add --no-cache git
      - ./scripts/release-version.sh compute

  validate-deployment:
    when:
      - event: deployment
    depends_on: []
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    commands:
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" != "dev" ]; then
          echo "ERROR: deploy target must be 'dev' (got: '$$CI_PIPELINE_DEPLOY_TARGET')"
          echo "       dev is the only environment that exists; a production"
          echo "       environment is deferred to #388, which re-adds its target."
          exit 1
        fi

  # This workflow computed its release tag itself — workflows share nothing. With
  # the pipeline number as the patch it matches the tag web and android built
  # with, and no other pipeline can build under it; this check makes that a
  # verified fact rather than an assumption before anything is tagged or rolled
  # out: refuse any image whose revision label is not this commit.
  #
  # On a deployment it first requires the tag to have been *reused*: only a green
  # push pipeline tags a commit, so a freshly allocated tag means this commit was
  # never built and tested — or its push is still running — and there are no
  # images of its own to deploy.
  verify-release-images:
    when:
      - event: [push, deployment]
    depends_on:
      - compute-version
    image: &docker-image docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes: &docker-socket
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - |
        if [ "$$CI_PIPELINE_EVENT" = "deployment" ] && [ "$$(cat .release-tag-reused)" != "true" ]; then
          echo "ERROR: commit $$CI_COMMIT_SHA has no release tag, so no push pipeline"
          echo "       built and tested it (or its push pipeline has not finished)."
          echo "       Deploy a commit whose push pipeline is green."
          exit 1
        fi
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - |
        RELEASE_TAG=$$(cat .release-tag)
        for REPO in registry.desync.link/v-note registry.desync.link/v-note-android; do
          docker pull --quiet "$$REPO:$$RELEASE_TAG"
          ./scripts/check-image-metadata.sh "$$REPO:$$RELEASE_TAG" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
        done

  # One step per target, each applying only that environment's blueprint (#274).
  # A single file covering every environment meant a manual deployment from a
  # feature branch rewrote another environment's OIDC provider: restricting a
  # *target* does not restrict a blueprint's reach. Dev is the only target today
  # (#392), and the per-env split is what keeps #388's prod file off dev.
  #
  # Any branch may deploy dev, and so apply this file: a branch that changes the
  # provider has to be able to apply it, or auth work cannot be tested until after
  # it merges — which is how #372 reached master in the first place. An unreviewed
  # branch can therefore break *dev* login for everyone until it is fixed,
  # reverted or master is redeployed — accepted deliberately, and caught at once
  # by smoke-oidc-login-dev below. Since #462 that takes someone choosing to
  # deploy the branch; a push alone no longer can.
  apply-authentik-blueprint-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - validate-deployment
      - verify-release-images
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0@sha256:9f262c4390205b5629e9af7560f4e492f0155395a429153703ba351206d9d975
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint-dev.yaml
      # Per-file instance names: two files sharing one instance would each
      # overwrite the other's stored content on every apply.
      instance_name: v-note-dev
      timeout_seconds: 900
      # #274 made the provider public (PKCE), so the blueprint interpolates no
      # client secret. Its one placeholder is the live smoke user's password
      # (#179): the same secret smoke-web-live-* signs in with, so the account
      # and the smoke can never disagree about it. A missing secret fails this
      # step (the plugin refuses unresolved placeholders) before anything is
      # applied.
      vars:
        V_NOTE_DEV_SMOKE_PASSWORD:
          from_secret: v_note_dev_smoke_password

  # The SQL console's proxy provider is created by the blueprint above, but a
  # provider does nothing until an outpost serves it — the forward-auth endpoint
  # answers 404 for a host no attached provider claims, and /dbconsole would be
  # permanently unreachable.
  #
  # This is NOT a blueprint entry, deliberately and permanently: the embedded
  # outpost is shared, its provider list also carries the eleven providers
  # protecting glances, woodpecker and the rest, and a blueprint writes a list
  # wholesale rather than appending. See the script's header and the 🚫 note in
  # authentik/blueprint-dev.yaml. The script appends, verifies, and refuses to
  # write a list that lost an entry.
  #
  # curl/jq unpinned as in publish-grafana-dashboard: the base image is
  # digest-pinned and Alpine drops superseded versions from a stable branch.
  attach-sqltool-outpost-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - apply-authentik-blueprint-dev
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    environment:
      AUTHENTIK_URL: https://auth.desync.link
      AUTHENTIK_TOKEN:
        from_secret: authentik_api_token
      PROVIDER_NAME: v-note-sql-console-dev
    commands:
      - apk add --no-cache curl jq bash
      - ./scripts/attach-sqltool-outpost.sh

  deploy-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - validate-deployment
      - compute-version
      - apply-authentik-blueprint-dev
      - attach-sqltool-outpost-dev
    # The docker CLI image with the sovereign-config CLI baked in, published by
    # the operator. It replaces `*docker-image` for the step that runs
    # `sovereign-config render`, and carries everything else it uses: Docker
    # 27.5.1 with the compose plugin (v2.33.0), sh and the busybox tools
    # deploy-v-note.sh needs. Pinned by digest like every other image here.
    #
    # The CLI must match the running sovereign-config server, so this pin moves
    # when the server does: bump the tag and digest together, deliberately, as a
    # commit. Verified at pin time: CLI 2.30.2 against server 2.30.2.
    image: registry.desync.link/sovereign-config-cli:2.30.2@sha256:08bf49099830f99b6dbc421527f13fd3f32e1156ed62c9d26987d26c256d1827
    volumes: *docker-socket
    # The whole dev environment. deploy-v-note.sh takes no arguments and knows nothing about which
    # environment it is deploying — every environment-specific value reaches it
    # from here, either literally or through the `render` layer below, which is
    # what makes a second environment (#388) a new block, not a script change.
    environment:
      # The CLI's own credential, and the only Woodpecker secret this deploy
      # still owns: a read-only connection rooted at /v-note/devops. `render`
      # reads the layer with it and then strips it from the child's environment,
      # so deploy-v-note.sh never sees it.
      #
      # Not to be confused with SOVEREIGN_CONFIG_ACCESS_URL_FILE below, which is
      # the *app's* credential for /v-note/dev/server and arrives as one of the
      # rendered values. Two URLs, near-identical names, different subtrees.
      SOVEREIGN_CONFIG_URL:
        from_secret: v_note_devops_sovereign_access_url
      # Shared infrastructure credentials — not v-note's to own, so they stay on
      # the broker (#391). Every build and verify step needs them anyway, and
      # aliasing them into /v-note/devops would only widen what the URL above can
      # read.
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      # Environment *identity* is written here rather than stored (#391). These
      # are coupled to other in-repo facts — the blueprint's redirect URIs, the
      # smoke step's host, the Android flavour hosts — so moving a copy into the
      # store would open a new drift pair rather than close one, and COMPOSE_FILE
      # and V_NOTE_IMAGE_REPOS describe the repo and must version with it.
      #
      # Being written here does NOT make them immutable from the store.
      # `render` layers the subtree's values *over* the inherited environment, so
      # a leaf added to /v-note/devops/dev/compose under any name below wins over
      # the literal here — silently, since the step logs none of them. Write
      # access to /v-note/devops is therefore equivalent to commit access for
      # these values, including V_NOTE_IMAGE_REPOS, which decides which images
      # get pulled and run. That is a deliberate trade (the same subtree already
      # holds the database password and the app's access URL, so anyone who can
      # write there can redirect the deploy regardless), but it is a property to
      # know about rather than assume away: if it ever needs to stop being true,
      # move these after the `--` so `env` applies them on top of the render.
      # Read by `docker compose` itself, so the script needs no -p/-f flags.
      COMPOSE_PROJECT_NAME: v-note-dev
      COMPOSE_FILE: deploy/docker-compose.yml:deploy/docker-compose.android-apk.yml
      V_NOTE_IMAGE_REPOS: registry.desync.link/v-note registry.desync.link/v-note-android
      V_NOTE_HOST: v-notes-dev.desync.link
      V_NOTE_CONTAINER_NAME: v-note-dev
      DB_VOLUME: v-note-dev-db
      # Enables the read-only SQL console (#299). Read by `docker compose`
      # itself, like COMPOSE_FILE above, so deploy-v-note.sh needs no flag —
      # and omitting it is how an environment opts out. Its credentials
      # (PGWEB_DB_PASSWORD, PGWEB_AUTH_USER, PGWEB_AUTH_PASS) are rendered from
      # /v-note/devops/dev/compose like POSTGRES_PASSWORD, and deploy-v-note.sh
      # requires them only when this profile is active.
      #
      # Anchored because smoke-sql-console-dev reads the same value: with the
      # console off, /dbconsole falls through to the app's router and the SPA
      # catch-all answers 200, which that check would (correctly, given what it
      # can see) call "publicly readable" — failing every deployment. One edit
      # turns both off together.
      COMPOSE_PROFILES: &dev-compose-profiles sqltool
    # POSTGRES_PASSWORD, SOVEREIGN_CONFIG_ACCESS_URL_FILE, V_NOTE_METRICS_ADDR and
    # APP_ENV are deliberately absent above: `render` reads them out of
    # /v-note/devops/dev/compose and puts them in deploy-v-note.sh's environment
    # (#391). Each is an *alias* of the very leaf the running server reads, so the
    # deploy and the app cannot disagree about the database password, the metrics
    # listener, or the environment label — which is exactly what a hand-kept
    # broker copy could do. APP_ENV in particular stays the canonical `dev` and
    # never the branch name: as a branch name it split one deployment across two
    # values, traces saying `dev` while the discovery labels said `feat/foo`, with
    # no single environment filter matching all three signals. The build is
    # identified by `observability.release` and the image's
    # `org.opencontainers.image.revision` instead.
    #
    # `render` fails closed — an unreadable layer, or one contributing no values,
    # means deploy-v-note.sh never runs at all.
    #
    # Woodpecker masks `from_secret` values in step logs, and these four are no
    # longer from_secret, so nothing here may echo them: `docker compose config`
    # keeps its --quiet, and deploy-v-note.sh must never gain `set -x`.
    #
    # The `sovereign-config` CLI is NOT installed here: it is baked into the step
    # image above. The in-pipeline installer pinned a version
    # the server later retired (its download 404'd and failed every deploy), and
    # was removed on PR #55.
    #
    # Two layers (#439): the environment's compose values, then the client
    # telemetry ingest's own (OIDC_ISSUER_URL, OIDC_AUDIENCE — aliases of the
    # app's oidc leaves — and ALLOWED_SERVICE_NAMES). Its own layer so it is
    # listed and reviewed apart from the database password. Both are required:
    # the deploy fails closed without either (deploy/docker-compose.yml says
    # why); telemetry is switched off by `client-telemetry/endpoint`, not by
    # dropping this layer.
    commands:
      - sovereign-config render /v-note/devops/dev/compose /v-note/devops/dev/otlp-collector-oidc -- ./scripts/deploy-v-note.sh

  # The gate #372 was missing. Everything upstream of this step passed while login
  # was down in both environments: the blueprint applied, the app was healthy, and
  # e2e was green against a mock IdP with no client registry. This is the only
  # step that asks the *real* Authentik whether it will accept our authorize
  # request. It runs after the deploy so it exercises the provider and the app
  # that were just published together.
  #
  # curl is deliberately unpinned, as in publish-grafana-dashboard: the base image
  # is digest-pinned, and Alpine drops superseded versions from a stable branch.
  # Whatever branch was deployed: this is what makes branch deploys to a shared
  # dev safe to allow. A branch that breaks dev login turns its own deployment
  # red, rather than being discovered by the next person to log in.
  smoke-oidc-login-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - deploy-dev
    image: &smoke-image alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    environment:
      V_NOTE_HOST: v-notes-dev.desync.link
    commands:
      - apk add --no-cache curl bash
      - ./scripts/smoke-oidc-login.sh

  # The only automated assertion that the SQL console is not publicly readable.
  # No CI stack can make it: e2e/docker-compose.test.yml has neither Traefik nor
  # Authentik, so the e2e suite proves the *database* boundary (read-only role,
  # no superuser, locked session) while this proves the *network* one. It also
  # checks that gating /dbconsole did not break SPA login on the same host,
  # which is the interaction #299 was least sure about.
  smoke-sql-console-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - deploy-dev
    image: *smoke-image
    environment:
      V_NOTE_HOST: v-notes-dev.desync.link
      # Same value as the deploy step's, by anchor — the check skips itself when
      # the console is not deployed.
      COMPOSE_PROFILES: *dev-compose-profiles
    commands:
      - apk add --no-cache curl bash
      - ./scripts/smoke-sql-console.sh

  # The authenticated half of the post-deploy smoke (#179). smoke-oidc-login
  # stops at Authentik's login page on purpose; this one goes through it. A real
  # browser signs in to the dev host as the blueprint's smoke user through the
  # real Authentik flow, then checks /api/me, creates a page, commits a stroke
  # over the page channel, proves both survive a reload, deletes the page and
  # signs out (e2e/live/, its own Playwright config — the mock-IdP suite in
  # e2e/tests/ is untouched and still runs pre-merge in web.yml).
  #
  # Whatever branch was deployed, like the other smokes: dev is shared and
  # last-deploy-wins, so a branch that breaks signing in or inking on dev must
  # turn its own deployment red.
  #
  # Same image and digest as the e2e stack's runner (e2e/docker-compose.test.yml),
  # so the live spec runs on exactly the Playwright the suite is pinned to.
  # The password arrives as from_secret, so Woodpecker masks it in the log;
  # nothing in the script or spec prints it.
  smoke-web-live-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - deploy-dev
    image: mcr.microsoft.com/playwright:v1.54.2-jammy@sha256:948dc1e8601eeb152b31ef57959a74c2170be6fe875c33518bf33aea424d8940
    environment:
      V_NOTE_HOST: v-notes-dev.desync.link
      # Identity, written here like V_NOTE_HOST; the blueprint's user entry must
      # carry the same two values (scripts/test-authentik-blueprints.sh).
      V_NOTE_SMOKE_USERNAME: v-note-smoke-dev
      V_NOTE_SMOKE_EMAIL: v-note-smoke-dev@smoke.invalid
      V_NOTE_SMOKE_PASSWORD:
        from_secret: v_note_dev_smoke_password
    commands:
      - ./scripts/smoke-web-live.sh

  # Publishes deploy/grafana/v-note-overview.json to Grafana (Applications / v-note)
  # over the HTTP API — the dashboard counterpart of apply-authentik-blueprint.
  # Every deployment of dev, from whichever branch, right after deploy-dev: the
  # dashboard tracks whatever is deployed to dev, so a branch's panels go live
  # with the metrics they chart and can be checked before merge. The last deploy
  # wins, as it does for dev itself, and the version message names the branch.
  # It does not wait for the smokes. grafana_api_token is the shared woodpecker-ci
  # service-account token (/woodpecker/shared, Edit on the Applications folder).
  # curl/jq are deliberately unpinned: the base image is digest-pinned, and Alpine
  # removes superseded versions from a stable branch's repo, so `pkg=<ver>` would
  # break this step on the next security update instead of picking it up.
  publish-grafana-dashboard:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - deploy-dev
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    environment:
      GRAFANA_URL: https://grafana.desync.link
      GRAFANA_FOLDER_UID: v-note
      GRAFANA_TOKEN:
        from_secret: grafana_api_token
    commands:
      - apk add --no-cache curl jq
      - GRAFANA_MESSAGE_PREFIX="v-note $$CI_COMMIT_BRANCH" RELEASE_TAG="$$(cat .release-tag)" COMMIT_SHA="$$CI_COMMIT_SHA" ./scripts/publish-grafana-dashboard.sh deploy/grafana/v-note-overview.json
      # NOT the alert rules (#439): the woodpecker-ci service account may not
      # write alerting — by design (mini-config OBSERVABILITY.md), and Grafana
      # also wants datasources:query on Prometheus, which it lacks. Until the
      # platform grants that (mini-config #445), deploy/grafana/v-note-alerts.json
      # is published by an operator with scripts/publish-grafana-alerts.sh;
      # re-add it here once the grant lands.

  # Push only, after the images are verified: the workflow-level depends_on has
  # already required checks, web and android to pass, so this commit's build is
  # tested and its tag is what a later deployment looks for (see the header).
  # There is no tag step on the deployment path — a deployable commit is already
  # tagged, and push-tag would only report that.
  tag-release:
    when:
      - event: push
    depends_on:
      - verify-release-images
    image: *release-version-image
    environment: *release-version-environment
    commands:
      - apk add --no-cache git
      - ./scripts/release-version.sh push-tag
