# code-vitals: record this repo's trunk commits (vcheesbrough/code-vitals).
#
# One code-vitals plugin step, configured here (code-vitals README § Measuring
# a repo). Its `settings:` are v-note's measurement config: code-vitals' own
# deployments re-read them from this file at master's head, so this is the
# only place they live. Keep them as they are unless v-note's layout changes:
# changing `areas.rules` needs a new `areas.version`, which re-measures v-note's
# whole history at the next code-vitals deploy.
#
# A workflow of its own, so it never blocks or slows this repo's build: its
# one step is `failure: ignore`, and a missed run is harmless — the next one
# catches up every trunk commit not yet recorded. It needs no checkout
# (skip_clone): the collector clones this public repo itself, with full history
# and tags. The plugin starts the collector through the docker socket, because
# code-vitals' prod Postgres and its OTLP collector are on networks a plugin
# step cannot join.
when:
  - event: [push, manual]
    branch: master

skip_clone: true

steps:
  code-vitals:
    # Moving tag `:stable`, which code-vitals' prod deployment moves only after
    # its checks pass — the approved exception to digest pinning (code-vitals
    # AGENTS.md § Deviations register).
    image: registry.desync.link/code-vitals-plugin:stable
    failure: ignore
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    settings:
      trunk: master
      # Tried in order at each commit; the minor is the iteration. version.txt
      # predates [workspace.package] and has gone stale (0.54), so it is only
      # the fallback for commits from before Cargo carried the version.
      version_sources:
        - {path: Cargo.toml, kind: cargo-workspace}
        - {path: Cargo.toml, kind: cargo-package}
        - {path: version.txt, kind: plain}
      areas:
        version: 1
        rules:
          - {glob: "crates/**", area: server}  # the axum server and its protocol crate
          - {glob: "frontend/**", area: web}
          - {glob: "android/**", area: android}
      # code-vitals' prod writer, from the broker's shared layer.
      writer_password:
        from_secret: code_vitals_prod_writer_password
