# Automated PR review agent for vcheesbrough/v-note.
# See https://github.com/vcheesbrough/claude-pr-agent and docs/PR-AGENT.md.
#
# Required Woodpecker secrets (served by the Woodpecker secret broker from
# sovereign-config /woodpecker/repos/vcheesbrough/v-note/):
#   claude_oauth_token
#   pr_reviewer_gh_app_id
#   pr_reviewer_gh_app_installation_id
#   pr_reviewer_gh_app_private_key_b64
# Mark pull_request-allowed. Do not commit secret values.
#
# TEMPORARILY DISABLED (2026-06-06): Claude account/OAuth issues.
# Re-enable: replace `when` below with `event: pull_request`.

when:
  - evaluate: 'false'

steps:
  review:
    image: registry.desync.link/claude-pr-agent:4beb5aa@sha256:c738c93047bdb4f3903712f645ca928d06a97a1def06582fefb09804af7e3bb8
    pull: true
    environment:
      # Git 2.35+ rejects directories owned by a different user than the
      # running process. The clone step and review container run as different
      # UIDs on the same shared workspace volume, triggering the check.
      # These three vars configure git (via env) to trust any directory,
      # bypassing the ownership check without touching ~/.gitconfig.
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      CLAUDE_TIMEOUT: 600
      CLAUDE_CODE_OAUTH_TOKEN:
        from_secret: claude_oauth_token
      PR_REVIEWER_GH_APP_ID:
        from_secret: pr_reviewer_gh_app_id
      PR_REVIEWER_GH_APP_INSTALLATION_ID:
        from_secret: pr_reviewer_gh_app_installation_id
      PR_REVIEWER_GH_APP_PRIVATE_KEY_B64:
        from_secret: pr_reviewer_gh_app_private_key_b64
