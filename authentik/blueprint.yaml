version: 1
metadata:
  name: v-note OIDC
  labels:
    blueprints.goauthentik.io/description: "v-note OAuth2 providers (dev + prod) and access scopes"

entries:
  - model: authentik_core.group
    state: present
    identifiers:
      name: v-note-dev-users
    attrs:
      name: v-note-dev-users

  - model: authentik_core.group
    state: present
    identifiers:
      name: v-note-prod-users
    attrs:
      name: v-note-prod-users

  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: "v-note:dev:access"
    attrs:
      name: "v-note:dev:access"
      scope_name: "v-note:dev:access"
      description: "Grants access to v-note dev"
      expression: |
        return {}

  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: "v-note:prod:access"
    attrs:
      name: "v-note:prod:access"
      scope_name: "v-note:prod:access"
      description: "Grants access to v-note prod"
      expression: |
        return {}

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: v-note-browser-dev
    attrs:
      name: v-note-browser-dev
      client_id: v-note-browser-dev
      client_secret: ${AUTHENTIK_V_NOTE_DEV_CLIENT_SECRET}
      client_type: confidential
      redirect_uris:
        - url: "https://v-notes-dev.desync.link/auth/callback"
          matching_mode: strict
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "v-note:dev:access"]]

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: v-note-browser-prod
    attrs:
      name: v-note-browser-prod
      client_id: v-note-browser-prod
      client_secret: ${AUTHENTIK_V_NOTE_PROD_CLIENT_SECRET}
      client_type: confidential
      redirect_uris:
        - url: "https://v-notes.desync.link/auth/callback"
          matching_mode: strict
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "v-note:prod:access"]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: v-note-dev
    attrs:
      name: v-note (dev)
      slug: v-note-dev
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, v-note-browser-dev]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: v-note-prod
    attrs:
      name: v-note (prod)
      slug: v-note-prod
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, v-note-browser-prod]]
