when:
  - event: [push, deployment]

steps:
  build:
    when:
      - event: push
    image: &docker-image docker:27-cli
    volumes: &docker-socket
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t registry.desync.link/v-note:$$CI_COMMIT_SHA .

  build-android:
    when:
      - event: push
    image: mingc/android-build-box:latest
    commands:
      - ./scripts/sync-version.sh
      - cd android && chmod +x ./gradlew && ./gradlew :app:assembleDevDebug :app:testDevDebugUnitTest

  contract-validation:
    when:
      - event: push
    image: rust:1.89.0
    commands:
      - cargo test -p protocol

  e2e:
    when:
      - event: push
    image: *docker-image
    volumes: *docker-socket
    commands:
      - |
        REPORT=/srv/dev/playwright-reports/v-note-$$CI_PIPELINE_NUMBER--$(echo $$CI_COMMIT_BRANCH | tr '/' '-')--$(echo $$CI_COMMIT_SHA | cut -c1-7)
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/v-note:$$CI_COMMIT_SHA docker compose -f e2e/docker-compose.test.yml up --build --force-recreate --abort-on-container-exit --exit-code-from playwright && RC=0 || RC=$$?
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/v-note:$$CI_COMMIT_SHA docker compose -f e2e/docker-compose.test.yml down --volumes
        echo "Test report: $$REPORT/index.html"
        exit $$RC

  validate-deployment:
    when:
      - event: deployment
    image: alpine:3.21
    commands:
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" != "dev" ] && [ "$$CI_PIPELINE_DEPLOY_TARGET" != "prod" ]; then
          echo "ERROR: deploy target must be 'dev' or 'prod' (got: '$$CI_PIPELINE_DEPLOY_TARGET')"
          exit 1
        fi
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" = "prod" ] && [ "$$CI_COMMIT_BRANCH" != "master" ]; then
          echo "ERROR: prod can only be deployed from master (current branch: '$$CI_COMMIT_BRANCH')"
          exit 1
        fi

  compute-version:
    when:
      - event: deployment
    image: &alpine-git alpine/git:latest
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - ./scripts/sync-version.sh
      - VERSION_BASE=$(cat version.txt)
      - PATCH=$(git ls-remote --tags --refs https://x-token:$$GITHUB_TOKEN@github.com/$$CI_REPO.git "refs/tags/v$$VERSION_BASE.*" | wc -l | tr -d ' ')
      - echo "$$VERSION_BASE.$$PATCH" > .version
      - echo "$$VERSION_BASE.$$PATCH-$(echo $$CI_COMMIT_SHA | cut -c1-7)" > .version-dev
      - echo "Version $(cat .version), dev $(cat .version-dev)"

  apply-authentik-blueprint:
    when:
      - event: deployment
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint.yaml
      instance_name: v-note
      timeout_seconds: 900
      vars:
        AUTHENTIK_V_NOTE_DEV_CLIENT_SECRET:
          from_secret: v_note_dev_oidc_client_secret
        AUTHENTIK_V_NOTE_PROD_CLIENT_SECRET:
          from_secret: v_note_prod_oidc_client_secret

  push:
    when:
      - event: deployment
    image: *docker-image
    volumes: *docker-socket
    environment: &registry-creds
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - docker build -t registry.desync.link/v-note:$(cat .version) -t registry.desync.link/v-note:$(cat .version-dev) .
      - docker push registry.desync.link/v-note:$(cat .version)
      - docker push registry.desync.link/v-note:$(cat .version-dev)

  tag-release:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    image: *alpine-git
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - git tag v$(cat .version)
      - git push https://x-token:$$GITHUB_TOKEN@github.com/$$CI_REPO.git v$(cat .version)

  deploy-dev:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      OIDC_CLIENT_SECRET:
        from_secret: v_note_dev_oidc_client_secret
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - docker volume create v-note-dev-db
      - |
        V_NOTE_IMAGE_TAG=$(cat .version-dev) APP_VERSION=$(cat .version-dev) \
        APP_ENV=$$CI_COMMIT_BRANCH V_NOTE_HOST=v-notes-dev.desync.link \
        V_NOTE_CONTAINER_NAME=v-note-dev DB_VOLUME=v-note-dev-db \
        OIDC_ISSUER_URL=https://auth.desync.link/application/o/v-note-dev/ \
        OIDC_CLIENT_ID=v-note-browser-dev \
        OIDC_CLIENT_SECRET=$$OIDC_CLIENT_SECRET \
        OIDC_REDIRECT_URI=https://v-notes-dev.desync.link/auth/callback \
        REQUIRED_SCOPE=v-note:dev:access \
        OIDC_END_SESSION_URL=https://auth.desync.link/application/o/v-note-dev/end-session/ \
        docker compose -p v-note-dev -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --pull always

  deploy-prod:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      OIDC_CLIENT_SECRET:
        from_secret: v_note_prod_oidc_client_secret
    commands:
      - echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - docker volume create v-note-prod-db
      - |
        V_NOTE_IMAGE_TAG=$(cat .version) APP_VERSION=$(cat .version) \
        APP_ENV=production V_NOTE_HOST=v-notes.desync.link \
        V_NOTE_CONTAINER_NAME=v-note DB_VOLUME=v-note-prod-db \
        OIDC_ISSUER_URL=https://auth.desync.link/application/o/v-note-prod/ \
        OIDC_CLIENT_ID=v-note-browser-prod \
        OIDC_CLIENT_SECRET=$$OIDC_CLIENT_SECRET \
        OIDC_REDIRECT_URI=https://v-notes.desync.link/auth/callback \
        REQUIRED_SCOPE=v-note:prod:access \
        OIDC_END_SESSION_URL=https://auth.desync.link/application/o/v-note-prod/end-session/ \
        docker compose -p v-note -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --pull always
